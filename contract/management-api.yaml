openapi: 3.0.3

info:
  title: Clavia Management API
  # The API's own version, the `v1` of its paths: see "Versions" below.
  version: '1'
  license:
    name: BSD-3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause
  description: |
    Administration of a Clavia deployment: end users, client applications, the APIs
    tokens are issued for, and the roles that grant people permissions on them.

    **A machine plane.** Every operation takes a bearer access token issued for this API
    (its `aud` is the Management API identifier, `https://management.{domain}/api/v1/` by
    default) and carrying the scope the operation names. The browser session of
    `auth.{domain}` is never accepted here, and neither is a token in the query string or
    the body. Checks are made in this order: the token is live (known, unrevoked,
    unexpired, its subject still active), it was issued for this API, it carries the
    scope. Failures are RFC 6750 challenges.

    **This document is the contract.** Every request is validated against it before it
    reaches the application: a body carrying a field not described here is refused, not
    ignored. Errors other than authentication failures are RFC 9457 problem documents.

    **Secrets appear once.** A password is never returned; a client secret only in the
    response that creates or rotates it.

    There is no endpoint that grants a client access to an API: a scope that could write
    client grants would be the scope that grants every other scope. Grants are written
    from the shell (`clavia clients:grant`).

    **Versions.** `info.version` is the version of this API, `1`, the `v1` of its paths. Additions
    (an operation, an optional field, a value) never change it; a change that would break a client
    would come as `/api/v2`, beside this one. Which server release a copy of this document belongs
    to is a different number, Clavia's own (`0.3.0`), shown beside it on the published reference.

    ## Guides

    Read these before the operations below. They come with each release, beside this reference.

    - [Getting a token](guides/getting-a-token.html): a machine client, or a person signing in.
    - [Scopes and roles](guides/scopes-and-roles.html): what a token may do, and who decides.
    - [Errors](guides/errors.html): problem documents, bearer refusals, and stepping up.
    - [Paging and search](guides/paging-and-search.html): reading a list.
    - [DPoP-bound tokens](guides/dpop.html): tokens a stolen copy of is useless.
    - [Registering clients](guides/registering-clients.html): letting others register their applications.

servers:
  - url: /

tags:
  - name: users
    x-displayName: Users
    description: End users — the resource owners, and the subjects of ID tokens.
  - name: roles
    x-displayName: Roles
    description: |
      Named sets of permissions, across APIs, that users are given. On an API that enforces
      roles, a person's token carries only what their roles grant there.
  - name: clients
    x-displayName: Clients
    description: Applications registered to obtain tokens.
  - name: initial-access-tokens
    x-displayName: Initial access tokens
    description: |
      What lets software register itself as a client at `/oauth2/register` (RFC 7591 §3): a
      token an operator hands to a partner, good for a number of registrations until a date,
      revocable. A client registered with one is always third-party, so it never reaches a system
      API. The token is shown once, when it is issued; only its digest is kept.
  - name: provisioning-tokens
    x-displayName: Provisioning tokens
    description: |
      What lets a directory (Entra ID, Okta, Google Workspace) provision accounts through SCIM 2.0
      (RFC 7644) at `https://management.{domain}/scim/v2`: a token bound to one connection, a pool or
      an enterprise connection (OpenID Connect, SAML), where every account it creates, reads or
      changes lives. Give the directory the `base_url` and the `token` of the answer. The token is
      shown once, when it is issued, and only its digest is kept; it expires (a year by default, two
      at most) and is flagged `expiring_soon` within thirty days of its end, so issue the next one in
      time. What a directory does is recorded with the token as its actor (`provisioning`).
  - name: webhooks
    x-displayName: Webhooks
    description: |
      Endpoints that receive the audit events they subscribe to, as `GET /api/v1/audit-events`
      renders them, signed per the Standard Webhooks specification with a secret this server
      generates, shows once and keeps sealed. Registering one, or changing where it points or what
      it hears, testing it, or reading its delivery log, also needs `read:audit_events`: streaming
      the trail is reading it.

      **What a receiver gets.** A `POST` whose body is a `WebhookPayload` (`type`, `timestamp`,
      and `data`, the `AuditEvent`), with three headers from the
      [Standard Webhooks](https://www.standardwebhooks.com/) specification: `webhook-id` (the audit
      event's id, the same across retries: use it to drop duplicates), `webhook-timestamp` (Unix
      seconds, when this attempt was signed) and `webhook-signature`.

      **Verifying it.** Take the secret's bytes (the base64 after `whsec_`), compute HMAC-SHA256
      over `{webhook-id}.{webhook-timestamp}.{body}` with the body exactly as received, and compare
      its base64, in constant time, with each space-separated `v1,…` value of `webhook-signature`:
      during a rotation there are two, one per secret. Refuse a `webhook-timestamp` more than five
      minutes from your clock, so a recorded delivery cannot be replayed. Any Standard Webhooks
      library does all of this.

      **Answering it.** Any 2xx within ten seconds is a delivery; anything else, a redirect
      included, is retried after 5 s, 5 min, 30 min, 2 h, 5 h, 10 h and 10 h, then abandoned. An
      endpoint every delivery to which has failed for five days is switched off
      (`webhook.disabled`, `disabled_reason: failing`) until it is switched on again.
  - name: resource-servers
    x-displayName: APIs
    description: The APIs tokens are issued for, and the permissions each defines.
  - name: connections
    x-displayName: Connections
    description: |
      The ways people sign in — pools of accounts with passwords, social providers, OpenID
      Connect providers — and which applications may use each.
  - name: signing-keys
    x-displayName: Signing keys
    description: |
      The keys ID tokens, logout tokens and JWT access tokens are signed with, for the
      `postgres` backend, whose keys this server keeps. Never any key material: the public
      keys are the JWKS's to publish (`/oidc/jwks.json`), and the private ones never leave the
      backend. With any other backend the keys live at the provider and are rotated there;
      both operations answer 409.
  - name: saml-keys
    x-displayName: SAML keys
    description: |
      This server's own keys as a SAML service provider: one that signs its requests, one that
      identity providers encrypt assertions to, each published as a self-signed certificate in the
      service provider metadata. Never any key material: certificates are public, the private halves
      stay in their backend (sealed in PostgreSQL with the `postgres` backend, or in a KMS, which
      never lets them out; their certificates are then built once through the KMS and kept).

      A rotation is a rollover in steps: a **next** pair is published beside the current one, and
      promoted once identity providers have had `CLAVIA_SAML_KEY_OVERLAP_DAYS` to read it; the pair
      it replaces is **retired**, its encryption key still decrypting for as long again.
  - name: audit
    x-displayName: Audit log
    description: |
      The audit trail: sign-ins, sessions, consents, tokens and every change to the
      configuration, append-only and kept for CLAVIA_AUDIT_RETENTION_DAYS. Read-only.

paths:
  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: List users, newest first, optionally searching the email address.
      security:
        - managementToken: [read:users]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
              examples:
                UserPage:
                  $ref: '#/components/examples/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: |
        Create a user, with a password or to be invited.

        A password is hashed and never returned. Without one the account has none yet
        (`has_password` is `false`): it cannot sign in with a password, and its person
        chooses one from the link `POST /api/v1/users/{user_id}/password-reset` mails them,
        an invitation.
      security:
        - managementToken: [create:users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            examples:
              UserCreate:
                $ref: '#/components/examples/UserCreate'
      responses:
        '201':
          description: The user, as created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                User:
                  $ref: '#/components/examples/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      security:
        - managementToken: [read:users]
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                User:
                  $ref: '#/components/examples/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update a user
      description: |
        Change some of a user's fields; absent fields are left alone.

        A profile field set to `null` is cleared. A new email address is unverified
        unless the same request says otherwise. Deactivating an account stops every
        session and token it holds from being accepted on their next use.

        `app_metadata` is replaced whole (a key is removed by leaving it out) and also needs
        `update:users_app_metadata`: claim mappings copy it into tokens and APIs authorize on it,
        so writing it is granting access. Without that scope the request is `403` and nothing
        changes. It holds facts, never secrets: anything in it can end up in a token an
        application reads.
      security:
        - managementToken: [update:users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            examples:
              UserUpdate:
                $ref: '#/components/examples/UserUpdate'
      responses:
        '200':
          description: The user, as updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                User:
                  $ref: '#/components/examples/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        Delete a user, and every code and token issued on their behalf.

        Refused for the account the token is acting as.
      security:
        - managementToken: [delete:users]
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{user_id}/mfa:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [users]
      operationId: resetUserMfa
      summary: Reset a user's MFA
      description: |
        Turn a user's two-factor authentication off.

        The way back for someone who lost both their authenticator and their recovery
        codes: every second factor and every recovery code of the account is removed,
        and the next sign-in is by password alone. Idempotent — the user's
        two-factor authentication is off afterwards, whether it was on or not.
      security:
        - managementToken: [update:users]
      responses:
        '204':
          description: Two-factor authentication is off.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{user_id}/password-reset:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [users]
      operationId: sendUserPasswordLink
      summary: Send a password link
      description: |
        Mail a user a link to choose a password.

        An invitation for an account that has no password yet, a reset for one that has: the
        same one-time link the sign-in page mails to whoever asks, worded for each. It works
        once, expires after `CLAVIA_RESET_LINK_LIFETIME`, and dies as soon as the account's
        password or address changes. Choosing a password verifies the address and ends every
        session of the account.

        The mail is in the language of the account's profile (`locale`), matched among the
        languages the deployment offers (`fr-CA` finds `fr`), else in the deployment's default
        language (`CLAVIA_DEFAULT_LANGUAGE`).

        Unlike the public form, the caller is told how it went. Mail counts against the
        account send limit per address and per client address, so a user cannot be flooded.
        Only an account in a pool has a password; a deactivated account is refused.
      security:
        - managementToken: [create:user_tickets]
      responses:
        '202':
          description: The email was sent and the link is open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordLinkSent'
              examples:
                PasswordLinkSent:
                  $ref: '#/components/examples/PasswordLinkSent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/users/{user_id}/consents:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: listUserConsents
      summary: List a user's consents
      description: |
        The applications a user allowed to act as them, and what they allowed.

        Only what the user was actually asked on the consent screen: a first-party
        application that did without it has nothing here. Oldest first.
      security:
        - managementToken: [read:users]
      responses:
        '200':
          description: The user's consents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserConsent'
              examples:
                UserConsents:
                  $ref: '#/components/examples/UserConsents'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{user_id}/consents/{client_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ClientId'
    delete:
      tags: [users]
      operationId: withdrawUserConsent
      summary: Withdraw a consent
      description: |
        Withdraw everything a user allowed one application, on every API.

        The application's next authorization request asks again. Tokens it already holds
        run to their own expiry. Idempotent: nothing to withdraw is still withdrawn; only
        an unknown user is a 404.
      security:
        - managementToken: [update:users]
      responses:
        '204':
          description: Withdrawn.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{user_id}/sessions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: listUserSessions
      summary: List a user's sessions
      description: |
        A user's browser sessions, with the applications that signed in through each.

        Oldest first. Device approvals are not sessions and are not here.
      security:
        - managementToken: [read:users]
      responses:
        '200':
          description: The user's sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSession'
              examples:
                UserSessions:
                  $ref: '#/components/examples/UserSessions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [users]
      operationId: endUserSessions
      summary: End all of a user's sessions
      description: |
        Sign a user out everywhere.

        Ends every browser session and, after the response, posts a logout token to each
        application that signed in through one of them and registered a back-channel logout
        URI. Tokens already issued are not revoked (`/oauth2/revoke` does that). Idempotent:
        a user with no session is already signed out everywhere.
      security:
        - managementToken: [update:users]
      responses:
        '204':
          description: Signed out everywhere.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{user_id}/sessions/{sid}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/Sid'
    delete:
      tags: [users]
      operationId: endUserSession
      summary: End a session
      description: End one session, by its sid, and tell its applications.
      security:
        - managementToken: [update:users]
      responses:
        '204':
          description: Ended.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{user_id}/identities:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: listUserIdentities
      summary: List linked identities
      description: The accounts at external providers linked to this one.
      security:
        - managementToken: [read:users]
      responses:
        '200':
          description: The identities, by connection, then subject.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Identity'
              examples:
                UserIdentities:
                  $ref: '#/components/examples/UserIdentities'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{user_id}/identities/{connection}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IdentityConnection'
    delete:
      tags: [users]
      operationId: unlinkUserIdentity
      summary: Unlink an identity
      description: |
        Detach the account's identity at an external provider.

        Signing in through that provider again makes a new account, or links by address as
        a first sign-in would. Refused (409) when it is the account's only way in: no
        password it could use and nothing else linked.
      security:
        - managementToken: [update:users]
      responses:
        '204':
          description: Unlinked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{user_id}/passkeys:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: listUserPasskeys
      summary: List a user's passkeys
      description: |
        What each is called, whether a credential manager syncs it, its maker when known, and
        when it was added and last used: never its credential id or its key. Oldest first.
      security:
        - managementToken: [read:users]
      responses:
        '200':
          description: The passkeys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPasskey'
              examples:
                UserPasskeys:
                  $ref: '#/components/examples/UserPasskeys'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{user_id}/passkeys/{passkey_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/PasskeyId'
    delete:
      tags: [users]
      operationId: removeUserPasskey
      summary: Remove a passkey
      description: |
        Remove one of the account's passkeys.

        For somebody who lost the device it lived on. One at a time, so an operator sees what
        they remove; the authenticator app and the recovery codes are
        `DELETE /api/v1/users/{user_id}/mfa`. A passkey of another account is not found.
      security:
        - managementToken: [update:users]
      responses:
        '204':
          description: Removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{user_id}/roles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: listUserRoles
      summary: List a user's roles
      description: The roles a user holds, by name.
      security:
        - managementToken: [read:users]
      responses:
        '200':
          description: The user's roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
              examples:
                Roles:
                  $ref: '#/components/examples/Roles'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    put:
      tags: [users]
      operationId: setUserRoles
      summary: Set a user's roles
      description: |
        Make a user hold exactly these roles.

        Needs `update:roles`, not `update:users`: this confers authority, and conferring it
        takes the scope that guards authority wherever it happens. Refused whole (404) when
        one of the roles does not exist. Takes effect on the user's next token.
      security:
        - managementToken: [update:roles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleIds'
            examples:
              RoleIds:
                $ref: '#/components/examples/RoleIds'
      responses:
        '200':
          description: The roles the user holds now, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
              examples:
                Roles:
                  $ref: '#/components/examples/Roles'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/users/{user_id}/permissions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      operationId: listUserPermissions
      summary: List a user's permissions
      description: |
        Every permission a user holds through their roles, and which roles grant each.

        Several roles can grant the same permission; all of them are listed, because
        taking one away does not necessarily take the permission.
      security:
        - managementToken: [read:users]
      responses:
        '200':
          description: The permissions, by API identifier, then value.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EffectivePermission'
              examples:
                EffectivePermissions:
                  $ref: '#/components/examples/EffectivePermissions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/clients:
    get:
      tags: [clients]
      operationId: listClients
      summary: List clients
      description: List clients, newest first, optionally searching the id and the name.
      security:
        - managementToken: [read:clients]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page of clients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPage'
              examples:
                ClientPage:
                  $ref: '#/components/examples/ClientPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags: [clients]
      operationId: createClient
      summary: Create a client
      description: |
        Register a client. Its id — and, when confidential, its secret — are generated.

        The secret is in this response and nowhere else: only its hash is kept. A
        registration that no flow could serve is refused — a confidential client without
        a secret method, a public one with one, the client credentials grant for a public
        client, the code flow without a redirect URI or with only half of it.
      security:
        - managementToken: [create:clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
            examples:
              ClientCreate:
                $ref: '#/components/examples/ClientCreate'
      responses:
        '201':
          description: The client, with its secret.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientWithSecret'
              examples:
                ClientWithSecret:
                  $ref: '#/components/examples/ClientWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/clients/{client_id}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [clients]
      operationId: getClient
      summary: Get a client
      description: Read one client. Its secret is never part of it.
      security:
        - managementToken: [read:clients]
      responses:
        '200':
          description: The client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              examples:
                Client:
                  $ref: '#/components/examples/Client'
                SelfRegisteredClient:
                  $ref: '#/components/examples/SelfRegisteredClient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    patch:
      tags: [clients]
      operationId: updateClient
      summary: Update a client
      description: |
        Change some of a client's registration; the result is checked as a new one would be.

        The type is not changeable — switching between public and confidential is a different
        client.

        `claims` replaces the application's custom claims (`ApplicationClaimMapping`); each refusal
        points at its entry (`/claims/2`), or at `/claims` for the list.
      security:
        - managementToken: [update:clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdate'
            examples:
              ClientUpdate:
                $ref: '#/components/examples/ClientUpdate'
      responses:
        '200':
          description: The client, as updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              examples:
                Client:
                  $ref: '#/components/examples/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [clients]
      operationId: deleteClient
      summary: Delete a client
      description: |
        Delete a client, and every code, token and grant it holds.

        Refused for the client the token was issued to.
      security:
        - managementToken: [delete:clients]
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/clients/{client_id}/logo:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [clients]
      operationId: getClientLogo
      summary: Download a client's logo
      description: |
        The image the application's sign-in pages show in place of this server's logo, as it was
        recognised: PNG, JPEG or WebP. `404` when it has none.
      security:
        - managementToken: [read:clients]
      responses:
        '200':
          description: The image.
          content:
            image/png:
              schema:
                type: string
                format: binary
              examples:
                ClientLogo:
                  $ref: '#/components/examples/ClientLogo'
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    put:
      tags: [clients]
      operationId: setClientLogo
      summary: Set a client's logo
      description: |
        The application's logo on its sign-in pages, in place of this server's: the body is the image
        itself. What it is is read from its content, whatever the `Content-Type` says: a PNG, JPEG or
        WebP image, 16 to 1024 pixels a side, at most 256 KiB; anything else, SVG included (an SVG can
        carry script), is refused with `422`. The pages load it from the sign-in origin
        (`https://auth.{domain}/auth/branding/{client_id}/logo`), never from anywhere else, beside the
        application's name and its `accent_color`. Recorded in the audit trail as `client.updated`,
        naming the field `logo`, never the image.
      security:
        - managementToken: [update:clients]
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
            examples:
              ClientLogo:
                $ref: '#/components/examples/ClientLogo'
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Set. The client's `logo_version` names the new image.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [clients]
      operationId: removeClientLogo
      summary: Remove a client's logo
      description: |
        The application's sign-in pages show this server's logo again. `404` when it has none.
      security:
        - managementToken: [update:clients]
      responses:
        '204':
          description: Removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/clients/{client_id}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      tags: [clients]
      operationId: rotateClientSecret
      summary: Rotate a client secret
      description: |
        Replace a confidential client's secret. The old one stops working at once.

        Tokens already issued are not affected; only the next token request needs the new secret.
      security:
        - managementToken: [update:clients]
      responses:
        '200':
          description: The client, with its new secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientWithSecret'
              examples:
                ClientWithSecret:
                  $ref: '#/components/examples/ClientWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/clients/{client_id}/connections:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    put:
      tags: [clients]
      operationId: setClientConnections
      summary: Set a client's connections
      description: |
        Replace the connections an application's users may sign in through.

        Takes effect at the next sign-in: a session established through a connection the
        application stops enabling no longer counts for it. A third-party application
        cannot be given a list (422): it uses the domain connections.
        An unknown connection is a 404, and nothing changes.
      security:
        - managementToken: [update:clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionNames'
            examples:
              ConnectionNames:
                $ref: '#/components/examples/ConnectionNames'
      responses:
        '200':
          description: The connections it enables now, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectionName'
              examples:
                ConnectionNameList:
                  $ref: '#/components/examples/ConnectionNameList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: List connections
      description: Every connection, by name, with whether it can work.
      security:
        - managementToken: [read:connections]
      responses:
        '200':
          description: The connections. Few by nature, so not paged.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
              examples:
                Connections:
                  $ref: '#/components/examples/Connections'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags: [connections]
      operationId: createConnection
      summary: Create a connection
      description: |
        Create a pool of accounts, or register an OpenID Connect provider.

        The name is permanent: accounts, sessions and identities record it, and for an OIDC
        connection it is part of the callback URL registered at the provider,
        `https://auth.{domain}/auth/social/{name}/callback`. A provider is discovered now —
        an issuer that does not answer, or names endpoints this server must not fetch, is
        refused (422) — and its client secret is stored encrypted and never returned.
        Social connections are built in: switched, not created.
      security:
        - managementToken: [create:connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreate'
            examples:
              ConnectionCreate:
                $ref: '#/components/examples/ConnectionCreate'
              SamlConnectionCreate:
                $ref: '#/components/examples/SamlConnectionCreate'
      responses:
        '201':
          description: The connection.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
              examples:
                Connection:
                  $ref: '#/components/examples/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/connections/{name}/refresh-metadata:
    parameters:
      - $ref: '#/components/parameters/ConnectionNameParameter'
    post:
      tags: [connections]
      operationId: refreshConnectionMetadata
      summary: Refresh SAML metadata
      description: |
        Read a `saml` connection's metadata URL again: its entity ID, single sign-on URL and signing
        certificates as they are now, after the identity provider rolled a certificate over. Only on
        demand, never at sign-in. The metadata is held to the rules of registration: a refusal is a
        422 pointing at `/saml/metadata_url`. A connection of another kind, or one registered from a
        document, is 409. Recorded as `connection.updated`.
      security:
        - managementToken: [update:connections]
      responses:
        '200':
          description: The connection, refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
              examples:
                SamlConnection:
                  $ref: '#/components/examples/SamlConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/connections/{name}:
    parameters:
      - $ref: '#/components/parameters/ConnectionNameParameter'
    get:
      tags: [connections]
      operationId: getConnection
      summary: Get a connection
      security:
        - managementToken: [read:connections]
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
              examples:
                PasswordPool:
                  $ref: '#/components/examples/PasswordPool'
                Connection:
                  $ref: '#/components/examples/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    patch:
      tags: [connections]
      operationId: updateConnection
      summary: Update a connection
      description: |
        Switch a connection, open it to third parties, rename it, or change its provider settings.

        Switching one off takes effect at the next sign-in: sessions established through it
        stand until they end. A social connection the deployment has no credentials for can
        be switched on — the intent is recorded — but stays unusable until it is configured.
        Changed OIDC settings are discovered again; a new secret replaces the old one.
      security:
        - managementToken: [update:connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionUpdate'
            examples:
              ConnectionUpdate:
                $ref: '#/components/examples/ConnectionUpdate'
      responses:
        '200':
          description: The connection, as updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
              examples:
                PasswordPool:
                  $ref: '#/components/examples/PasswordPool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [connections]
      operationId: deleteConnection
      summary: Delete a connection
      description: |
        Delete a pool or an OpenID Connect provider nothing depends on.

        Refused (409) while accounts belong to it or identities are linked through it, and
        for a built-in connection — the social ones and the default pool — which is
        switched off instead. Applications that enabled it stop listing it.
      security:
        - managementToken: [delete:connections]
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

