    put:
      tags: [clients]
      operationId: setClientConnections
      summary: Set a client's connections
      description: |
        Replace the connections an application's users may sign in through.

        Takes effect at the next sign-in: a session established through a connection the
        application stops enabling no longer counts for it. A third-party application
        cannot be given a list (422): it uses the domain connections.
        An unknown connection is a 404, and nothing changes.
      security:
        - managementToken: [update:clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionNames'
            examples:
              ConnectionNames:
                $ref: '#/components/examples/ConnectionNames'
      responses:
        '200':
          description: The connections it enables now, by name.
