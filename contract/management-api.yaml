        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/resource-servers/{resource_server_id}:
    parameters:
      - $ref: '#/components/parameters/ResourceServerId'
    get:
      tags: [resource-servers]
      operationId: getResourceServer
      summary: Get an API
      security:
        - managementToken: [read:resource_servers]
      responses:
        '200':
          description: The API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              examples:
                ResourceServer:
                  $ref: '#/components/examples/ResourceServer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    patch:
      tags: [resource-servers]
      operationId: updateResourceServer
      summary: Update an API
      description: |
        Rename an API, or replace the permissions it defines.

        The identifier never changes: it is the `aud` of every token already issued.
        A system API may be renamed, but its permissions are the server's own (409).

        `claims` replaces the API's custom claims: what its JWT access tokens carry, and what
        introspection reports, beside the protocol's (see `ClaimMapping`). Refused on a system
        API (409). Each refusal points at its entry (`/claims/2`), or at `/claims` for the list
        (more than twenty, two of a name, two reading the same metadata).
      security:
        - managementToken: [update:resource_servers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceServerUpdate'
            examples:
              ResourceServerUpdate:
                $ref: '#/components/examples/ResourceServerUpdate'
      responses:
        '200':
          description: The API, as updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              examples:
                ResourceServer:
                  $ref: '#/components/examples/ResourceServer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [resource-servers]
      operationId: deleteResourceServer
