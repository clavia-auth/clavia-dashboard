    delete:
      tags: [resource-servers]
      operationId: deleteResourceServer
      summary: Delete an API
      description: |
        Delete an API, its permissions and every client grant on it.

        Refused for a system API (409). Every role stops granting its permissions.
      security:
        - managementToken: [delete:resource_servers]
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
