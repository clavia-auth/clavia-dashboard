      description: Every endpoint, oldest first; there are at most twenty. Never a secret.
      security:
        - managementToken: [read:webhooks]
      responses:
        '200':
          description: The endpoints.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/Webhook'
              examples:
                WebhookList:
                  $ref: '#/components/examples/WebhookList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      tags: [webhooks]
      operationId: createWebhook
      summary: Create a webhook
      description: |
        Register an endpoint. Also needs `read:audit_events` (403 without it).

        The URL is https and held to the outbound URL policy now (422 naming why, never the
        address it resolved to) and again before every delivery. Each event type must be one the
        audit trail records (422 otherwise), or `["*"]` for all. At most twenty endpoints (409).

        The answer carries the `secret`, once: store it now, it cannot be read again. Recorded as
        `webhook.created`, with the URL's host only. Nothing is delivered yet by this server
        release: deliveries come with the next one.
      security:
        - managementToken: [create:webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
            examples:
              WebhookCreate:
                $ref: '#/components/examples/WebhookCreate'
      responses:
        '201':
          description: The endpoint, with its secret.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookWithSecret'
              examples:
                WebhookWithSecret:
                  $ref: '#/components/examples/WebhookWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/webhooks/{webhook_id}:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [webhooks]
      operationId: getWebhook
      summary: Get a webhook
      description: An endpoint, never its secret.
      security:
        - managementToken: [read:webhooks]
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
              examples:
                Webhook:
                  $ref: '#/components/examples/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    patch:
      tags: [webhooks]
      operationId: updateWebhook
      summary: Update a webhook
      description: |
        Change what is sent; absent fields are left alone. Changing `url` or `events` also needs
        `read:audit_events` (403 without it), and the URL is checked as at creation. Recorded as
        `webhook.updated`, naming the fields changed.
      security:
        - managementToken: [update:webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpdate'
            examples:
              WebhookUpdate:
                $ref: '#/components/examples/WebhookUpdate'
      responses:
        '200':
          description: The endpoint, as updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
              examples:
                Webhook:
                  $ref: '#/components/examples/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook
      description: Nothing more is sent to it. Recorded as `webhook.deleted`.
      security:
        - managementToken: [delete:webhooks]
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/webhooks/{webhook_id}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate a webhook secret
      description: |
        A new secret, returned once. The previous one keeps signing beside it for 24 hours
        (`previous_secret_until`), so a receiver can switch without missing a delivery. Recorded as
        `webhook.secret_rotated`.
      security:
        - managementToken: [update:webhooks]
      responses:
        '200':
          description: The endpoint, with its new secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookWithSecret'
              examples:
                WebhookWithSecret:
                  $ref: '#/components/examples/WebhookWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/webhooks/{webhook_id}/test:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [webhooks]
      operationId: testWebhook
      summary: Send a test event
      description: |
        Records `webhook.tested`, which goes to this endpoint and no other, through the same queue,
        envelope and signature as every event; `webhooks:deliver` sends it within the minute, and
        `GET …/deliveries` shows how it went. Also needs `read:audit_events` (403 without it). A
        switched-off endpoint is 409: nothing would be sent.
      security:
        - managementToken: [update:webhooks]
      responses:
        '202':
          description: Queued.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/webhooks/{webhook_id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: List webhook deliveries
      description: |
        The endpoint's deliveries, newest first, kept seven days after they end: what was sent, how
        many attempts, and the last one's status code, duration and failure category. Never a body,
        sent or received: neither is kept. It names the audit events sent, so it also needs
        `read:audit_events` (403 without it).
      security:
        - managementToken: [read:webhooks]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of deliveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryPage'
              examples:
                WebhookDeliveryPage:
                  $ref: '#/components/examples/WebhookDeliveryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/jobs/users-imports:
    post:
      tags: [users]
      operationId: importUsers
      summary: Import users
      description: |
        Queue an import of accounts into one pool, run by `clavia jobs:run` (every minute, by a
        scheduler): the body is NDJSON, one account per line, at most 10,000 lines and 5 MiB.

        Each line is a JSON object: `email` (required), `email_verified`, `is_active`, `name`,
        `given_name`, `family_name`, `nickname`, `picture`, `locale`, and `password_hash`, which must
        be in a format this server verifies: PBKDF2-HMAC-SHA-256, `$pbkdf2-sha256$i=…$salt$key`, at
        any count from 1,000 (replaced at today's count at the account's first sign-in). `user_id`,
        `connection`, `created_at` and `updated_at`, which an export writes, are ignored, so an
        export imports as it is. A plaintext `password`, or any other member, refuses the line.

        An import only creates. A line is refused, and the rest carry on, when it cannot be read,
        holds a field the API would refuse, or names an address already in the pool; the job's
        report lists each by number and reason, never by content. The input, hashes included, is
        let go when the job ends. Each account made is recorded in the audit trail as `user.created`,
        by the caller who queued the job.
      security:
        - managementToken: [create:users]
      parameters:
        - name: connection
          in: query
          description: The pool the accounts go into; the default pool when absent.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9-]{0,31}$'
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              format: binary
            examples:
              UserImport:
                $ref: '#/components/examples/UserImport'
      responses:
        '202':
          description: Queued. Follow it at the `Location`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserJob'
              examples:
                UserJobQueued:
                  $ref: '#/components/examples/UserJobQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/jobs/users-exports:
    post:
      tags: [users]
      operationId: exportUsers
      summary: Export users
      description: |
        Queue an export of the accounts of one connection, of any kind, run by `clavia jobs:run`;
        download it from `/api/v1/jobs/{job_id}/output` once the job is `completed`.

        The output is NDJSON, one account per line, in the shape an import takes: `email`,
        `email_verified`, `is_active`, the profile fields that are set, and `user_id`, `connection`,
        `created_at` and `updated_at`, which an import ignores. **Never a password hash**, nor
        anything of a second factor, a passkey, a linked identity or a session: an account moved by
        an export chooses its password again where it lands. The job's `summary.total` is the
        accounts written. The export is recorded in the audit trail as `user.exported`, by the
        caller who queued it, and kept, like the job, for seven days.
      security:
        - managementToken: [read:users]
      parameters:
        - name: connection
          in: query
          description: The connection whose accounts are exported; the default pool when absent.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9-]{0,31}$'
      responses:
        '202':
          description: Queued. Follow it at the `Location`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserJob'
              examples:
                UserExportQueued:
                  $ref: '#/components/examples/UserExportQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/jobs/{job_id}/output:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [users]
      operationId: getJobOutput
      summary: Download an export
      description: |
        What a completed export wrote: NDJSON, one account per line, never a password hash. `409`
        while the export is queued or running, or when it failed; `404` for an import, which writes
        nothing. Kept until the job is deleted, seven days after it finished.
      security:
        - managementToken: [read:users]
      responses:
        '200':
          description: The accounts, as an attachment.
          headers:
            Content-Disposition:
              description: '`attachment; filename="users-{job_id}.ndjson"`.'
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
              examples:
                UserExport:
                  $ref: '#/components/examples/UserExport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [users]
      operationId: getJob
      summary: Get a job
      description: |
        A bulk job, where it stands, and its report. A finished job is kept for seven days, then
        deleted by `clavia jobs:run`.
      security:
        - managementToken: [read:users]
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserJob'
              examples:
                UserJobCompleted:
                  $ref: '#/components/examples/UserJobCompleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: List audit events
      description: |
        Read the audit trail, newest first.

        Every filter given must hold. `client_id` matches the application that acted or that
        a person acted through; `target_type` and `target_id` go together.
      security:
        - managementToken: [read:audit_events]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: type
          in: query
          description: One or more event types, comma-separated.
          schema:
            type: string
            maxLength: 1024
        - name: actor_user_id
          in: query
          description: The person who acted.
          schema:
            type: string
            format: uuid
        - name: client_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: target_type
          in: query
          schema:
            $ref: '#/components/schemas/AuditTargetType'
        - name: target_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: outcome
          in: query
          schema:
            $ref: '#/components/schemas/AuditOutcome'
        - name: since
          in: query
          description: From this instant, included.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Up to this instant, excluded.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
              examples:
                AuditEventPage:
                  $ref: '#/components/examples/AuditEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'

components:
  securitySchemes:
    managementToken:
      type: oauth2
      description: |
        An access token whose audience is the Management API. A machine client obtains one
        with the client credentials grant, naming the API in `audience`, within the scopes
        its client grant allows. A person — through the dashboard — obtains one with the
        authorization code grant, within what their roles grant on this API.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            read:users: View end users
            create:users: Create end users
            update:users: Modify end users
            update:users_app_metadata: Modify the application metadata of end users
            delete:users: Delete end users
            read:clients: View client applications
            create:clients: Create client applications
            update:clients: Modify client applications
            delete:clients: Delete client applications
            read:resource_servers: View APIs
            create:resource_servers: Create APIs
            update:resource_servers: Modify APIs
            delete:resource_servers: Delete APIs
            read:roles: View roles and who holds them
            create:roles: Create roles and who holds them
            update:roles: Modify roles and who holds them
            delete:roles: Delete roles and who holds them
            read:connections: View connections
            create:connections: Create pools and OpenID Connect providers
            update:connections: Switch, rename and reconfigure connections
            delete:connections: Delete pools and OpenID Connect providers nothing depends on
            create:user_tickets: Mail end users a link to choose a password
            read:audit_events: Read the audit trail
            read:signing_keys: View the keys tokens are signed with
            create:signing_keys: Rotate the signing key
            read:initial_access_tokens: View the initial access tokens issued
            create:initial_access_tokens: Issue initial access tokens, which register third-party clients
            delete:initial_access_tokens: Revoke initial access tokens
            read:provisioning_tokens: View the tokens directories provision accounts with
            create:provisioning_tokens: Issue provisioning tokens, with which a directory manages a connection's accounts
            delete:provisioning_tokens: Revoke provisioning tokens
            read:webhooks: View the endpoints audit events are sent to
            create:webhooks: Create the endpoints audit events are sent to
            update:webhooks: Modify the endpoints audit events are sent to
            delete:webhooks: Delete the endpoints audit events are sent to

  headers:
    Location:
      description: Where the created resource can be read.
      schema:
        type: string

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Search:
      name: q
      in: query
      description: A case-insensitive substring, taken literally (`%` and `_` are not wildcards).
      schema:
        type: string
        maxLength: 200
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Sid:
      name: sid
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ClientId:
      name: client_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ResourceServerId:
      name: resource_server_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^rs_[A-Za-z0-9]{16}$'
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InitialAccessTokenId:
      name: initial_access_token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProvisioningTokenId:
      name: provisioning_token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: role_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^rol_[A-Za-z0-9]{16}$'
    ConnectionNameParameter:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ConnectionName'
    PasskeyId:
      name: passkey_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdentityConnection:
      name: connection
      in: path
      required: true
      description: The external connection the identity was linked through.
      schema:
        $ref: '#/components/schemas/ConnectionName'

  responses:
    BadRequest:
      description: |
        The request could not be read: malformed JSON or a parameter sent twice (a problem
        document), or a malformed `Authorization` header (`invalid_request`, an RFC 6750
        challenge).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            MalformedRequest:
              $ref: '#/components/examples/MalformedRequest'
        application/json:
          schema:
            $ref: '#/components/schemas/BearerError'
          examples:
            MalformedBearer:
              $ref: '#/components/examples/MalformedBearer'
    Unauthorized:
      description: |
        No usable token: none at all (a bare `Bearer` challenge and `{}`), or one that
        is unknown, expired, revoked, issued for another API or for an account that cannot
        be used (`invalid_token`).

        Or a token acting for a person who signed in with one factor, while this API's own
        `mfa_policy` is `required` (`insufficient_user_authentication`, RFC 9470 §3): the
        challenge names the `acr_values` to ask for, and the client sends the person back to
        `/oauth2/authorize` with them to step up. Checked after the audience and before the
        scope. A token a client obtained as itself is never refused for this.

        A token bound to a DPoP key (RFC 9449) is presented as `Authorization: DPoP <token>`
        with a fresh proof in the `DPoP` header, for this method and URL and naming the token.
        Presented as `Bearer`, it is `invalid_token`; without a good proof, `invalid_dpop_proof`.
        A DPoP request is challenged with `WWW-Authenticate: DPoP`, naming the `algs` accepted.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BearerError'
          examples:
            InvalidToken:
              $ref: '#/components/examples/InvalidToken'
            MissingToken:
              $ref: '#/components/examples/MissingToken'
            StepUp:
              $ref: '#/components/examples/StepUp'
    Forbidden:
      description: The token does not carry the scope this operation requires (`insufficient_scope`).
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BearerError'
          examples:
            InsufficientScope:
              $ref: '#/components/examples/InsufficientScope'
    UnsupportedMediaType:
      description: The body is not `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            UnsupportedMediaType:
              $ref: '#/components/examples/UnsupportedMediaType'
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            NotFound:
              $ref: '#/components/examples/NotFound'
    Conflict:
      description: The request contradicts what exists — a taken address or identifier, a protected resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            Conflict:
              $ref: '#/components/examples/Conflict'
    Unprocessable:
      description: The request does not satisfy this document, or describes something that could never work.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            Unprocessable:
              $ref: '#/components/examples/Unprocessable'
    TooManyRequests:
      description: A limit is reached; nothing was done. Try again later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            TooManyRequests:
              $ref: '#/components/examples/TooManyRequests'
    ServiceUnavailable:
      description: This deployment cannot do it now (it sends no mail, or the mail server refused); nothing was done.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

          examples:
            ServiceUnavailable:
              $ref: '#/components/examples/ServiceUnavailable'
  examples:
    ClientLogo:
      summary: A PNG image, its bytes (shown here as their start)
      value: "\u0089PNG\r\n\u001a\n…"
    UserImport:
      summary: Two accounts, one with its password hash
      value: |
        {"email":"grace@example.com","email_verified":true,"name":"Grace Hopper","password_hash":"$pbkdf2-sha256$i=600000$ZXhhbXBsZS1zYWx0LTAwMA$ZXhhbXBsZS1rZXktbm90LWEtcmVhbC1vbmUtMDAwMDA"}
        {"email":"alan@example.com","name":"Alan Turing","locale":"en-GB"}
    UserJobQueued:
      summary: An import, waiting for `clavia jobs:run`
      value:
        id: "0f1e2d3c-4b5a-4697-8a7b-6c5d4e3f2a1b"
        type: "users_import"
        status: "queued"
        connection: "password"
        created_at: "2026-03-04T09:00:00Z"
        started_at: null
        finished_at: null
        summary:
          total: 0
          created: 0
          failed: 0
        errors: []
        failure: null
    UserExportQueued:
      summary: An export, waiting for `clavia jobs:run`
      value:
        id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
        type: "users_export"
        status: "queued"
        connection: "password"
        created_at: "2026-03-04T09:00:00Z"
        started_at: null
        finished_at: null
        summary:
          total: 0
          created: 0
          failed: 0
        errors: []
        failure: null
    UserExport:
      summary: Two accounts, never a password hash
      value: |
        {"user_id":"3f8e2d1c-5b4a-4c9e-8d7f-6a5b4c3d2e1f","connection":"password","email":"ada@example.com","email_verified":true,"is_active":true,"name":"Ada Lovelace","created_at":"2026-01-10T08:30:00Z","updated_at":"2026-02-01T12:00:00Z"}
        {"user_id":"7c6b5a4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d","connection":"password","email":"grace@example.com","email_verified":false,"is_active":true,"created_at":"2026-01-12T09:00:00Z","updated_at":"2026-01-12T09:00:00Z"}
    UserJobCompleted:
      summary: An import done, two lines refused
      value:
        id: "0f1e2d3c-4b5a-4697-8a7b-6c5d4e3f2a1b"
        type: "users_import"
        status: "completed"
        connection: "password"
        created_at: "2026-03-04T09:00:00Z"
        started_at: "2026-03-04T09:01:00Z"
        finished_at: "2026-03-04T09:01:03Z"
        summary:
          total: 120
          created: 118
          failed: 2
        errors:
          - line: 17
            error: "already_exists"
            detail: "An account in this pool has that address."
          - line: 64
            error: "unsupported_hash"
            detail: "'password_hash' is not in a format this server verifies: PBKDF2-HMAC-SHA-256 ($pbkdf2-sha256$i=…$salt$key)."
        failure: null
    User:
      summary: A person
      value:
        id: "3f8e2d1c-5b4a-4c9e-8d7f-6a5b4c3d2e1f"
        connection: "password"
        email: "ada@example.com"
        email_verified: true
        is_active: true
        has_password: true
        mfa_enrolled: true
        passkey_count: 1
