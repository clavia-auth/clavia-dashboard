  schemas:
    SigningKey:
      type: object
      additionalProperties: false
      required: [kid, algorithm, status, published, created_at, retired_at, published_until]
      properties:
        kid:
          type: string
          description: The RFC 7638 thumbprint of the public key, as the JWKS and token headers name it.
        algorithm:
          type: string
          enum: [RS256]
        status:
          type: string
          enum: [active, retired]
        published:
          type: boolean
          description: Whether the key is in the JWKS now.
        created_at:
          type: string
          format: date-time
        retired_at:
          type: string
          format: date-time
          nullable: true
        published_until:
          type: string
          format: date-time
          nullable: true
          description: When a retired key leaves the JWKS; null for the active key.
    SigningKeyRotation:
      type: object
      additionalProperties: false
      required: [active, retired]
      properties:
        active:
          $ref: '#/components/schemas/SigningKey'
        retired:
          type: object
          nullable: true
          description: The key that was active, now retired; null when there was none.
          additionalProperties: false
          required: [kid, algorithm, status, published, created_at, retired_at, published_until]
          properties:
            kid:
              type: string
            algorithm:
              type: string
              enum: [RS256]
            status:
              type: string
              enum: [retired]
            published:
              type: boolean
            created_at:
              type: string
              format: date-time
            retired_at:
              type: string
              format: date-time
            published_until:
              type: string
              format: date-time
    Problem:
      description: An RFC 9457 problem document.
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          description: Always `about:blank`; `title` is the HTTP status phrase.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: What went wrong, for a person to read.
        errors:
          type: array
          description: For a request that did not satisfy this document, where and why.
          items:
            type: object
            additionalProperties: false
            required: [detail]
            properties:
              pointer:
                type: string
                description: An RFC 6901 JSON pointer into the request body, when the problem is there.
              parameter:
                type: string
                description: The name of the parameter at fault, when the problem is one.
              detail:
                type: string

    BearerError:
      description: |
        An RFC 6750 §3 error (or RFC 9449 §7.1's `invalid_dpop_proof`). Empty when the
        request carried no credentials at all: there is nothing yet to be wrong with.
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_token, insufficient_scope, insufficient_user_authentication, invalid_dpop_proof]
        error_description:
          type: string

    UserPage:
      description: One page of users, newest first.
      type: object
      additionalProperties: false
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          $ref: '#/components/schemas/Total'
        page:
          $ref: '#/components/schemas/PageNumber'
        per_page:
          $ref: '#/components/schemas/PerPage'

    ClientPage:
      description: One page of clients, newest first.
      type: object
      additionalProperties: false
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        total:
          $ref: '#/components/schemas/Total'
        page:
          $ref: '#/components/schemas/PageNumber'
        per_page:
          $ref: '#/components/schemas/PerPage'

    ResourceServerPage:
      description: One page of APIs, newest first.
      type: object
      additionalProperties: false
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceServer'
        total:
          $ref: '#/components/schemas/Total'
        page:
          $ref: '#/components/schemas/PageNumber'
        per_page:
          $ref: '#/components/schemas/PerPage'

    AuditEventPage:
      description: One page of audit events, newest first.
      type: object
      additionalProperties: false
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        total:
          $ref: '#/components/schemas/Total'
        page:
          $ref: '#/components/schemas/PageNumber'
        per_page:
          $ref: '#/components/schemas/PerPage'

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, type, occurred_at, outcome, actor, target, details, client_address, user_agent]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [authentication.succeeded, authentication.failed, session.ended, session.stepped_up, mfa.enrolled, mfa.removed, passkey.registered, passkey.renamed, passkey.removed, passkey.counter_regressed, consent.given, consent.refused, consent.withdrawn, device.approved, device.refused, token.issued, token.revoked, token.code_replayed, token.refresh_replayed, client.created, client.updated, client.deleted, client.secret_rotated, client.granted, user.created, user.updated, user.deleted, user.identity_unlinked, user.roles_changed, user.signed_up, user.email_verified, user.password_reset, user.password_link_sent, user.exported, role.created, role.updated, role.deleted, resource_server.created, resource_server.updated, resource_server.deleted, connection.created, connection.updated, connection.deleted, signing_key.created, signing_key.rotated, saml_key.generated, saml_key.rotated, initial_access_token.issued, initial_access_token.revoked, provisioning_token.issued, provisioning_token.revoked, webhook.created, webhook.updated, webhook.deleted, webhook.secret_rotated, webhook.tested, webhook.disabled]
        occurred_at:
          type: string
          format: date-time
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        actor:
          type: object
          additionalProperties: false
          required: [kind, user_id, client_id, provisioning_token_id]
          description: |
            Who acted: a `person` (with the application they acted through, if any), an
            `application` as itself, a directory through its `provisioning` token (SCIM), the `system`
            console, or `anonymous` — nobody known yet.
          properties:
            kind:
              type: string
              enum: [person, application, provisioning, system, anonymous]
            user_id:
              type: string
              format: uuid
              nullable: true
            client_id:
              type: string
              nullable: true
            provisioning_token_id:
              type: string
              format: uuid
              nullable: true
              description: The provisioning token a directory acted with; set for `provisioning` only.
        target:
          type: object
          nullable: true
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              $ref: '#/components/schemas/AuditTargetType'
            id:
              type: string
        details:
          type: object
          description: Short, flat values — a grant type, a scope, a reason. Never a credential.
          additionalProperties:
            oneOf:
              - type: string
              - type: integer
              - type: boolean
              - type: array
                items:
                  type: string
        client_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true

    AuditOutcome:
      type: string
      enum: [success, failure]

    AuditTargetType:
      type: string
      enum: [user, client, resource_server, role, connection, signing_key, saml_key, initial_access_token, provisioning_token, webhook]

    SamlKey:
      description: A SAML service provider key, by its certificate; never its private half.
      type: object
      additionalProperties: false
      required: [kid, usage, status, certificate, certificate_sha256, valid_until, created_at, promoted_at,
        retired_at]
      properties:
        kid:
          type: string
          description: The RFC 7638 thumbprint of the public key.
        usage:
          type: string
          enum: [signing, encryption]
          description: |
            `signing` signs this server's requests (and both certificates of its pair); `encryption` is
            what identity providers encrypt assertions to. One key, one usage.
        status:
          type: string
          enum: [next, current, retired]
          description: |
            `next` is published beside the current key but not used yet; `retired` is no longer
            published, an encryption key still decrypting until it is deleted.
        certificate:
          type: string
          description: The self-signed X.509 certificate, DER in base64, as metadata carries it.
        certificate_sha256:
          type: string
          description: SHA-256 of the certificate's DER, lower-case hex, for an administrator to compare.
        valid_until:
          type: string
          format: date-time
          description: The certificate's `notAfter`; identity providers pin the key and ignore it.
        created_at:
          type: string
          format: date-time
        promoted_at:
          type: string
          format: date-time
          nullable: true
          description: When it became current; null while it is next.
        retired_at:
          type: string
          format: date-time
          nullable: true

    SamlKeyRotation:
      type: object
      additionalProperties: false
      required: [step, promotes_at, keys]
      properties:
        step:
          type: string
          enum: [generated, introduced, waiting, promoted]
        promotes_at:
          type: string
          format: date-time
          nullable: true
          description: When the next pair can be promoted; null when there is none.
        keys:
          type: array
          items:
            $ref: '#/components/schemas/SamlKey'

    InitialAccessTokenPage:
      description: One page of initial access tokens, newest first.
      type: object
      additionalProperties: false
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InitialAccessToken'
        total:
          $ref: '#/components/schemas/Total'
        page:
          $ref: '#/components/schemas/PageNumber'
        per_page:
          $ref: '#/components/schemas/PerPage'

    InitialAccessTokenCreate:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 120
          description: Who it is for. The token itself is never shown again, so this is how it is told apart.
        expires_in:
          type: integer
          minimum: 60
          maximum: 7776000
          default: 604800
          description: Seconds until it expires, from a minute to ninety days. Seven days by default.
        max_uses:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: How many clients it may register.

    InitialAccessToken:
      type: object
      additionalProperties: false
      required: [id, description, created_at, expires_at, max_uses, uses, state, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        max_uses:
          type: integer
          minimum: 1
        uses:
          type: integer
          minimum: 0
          description: How many clients it has registered.
        state:
          $ref: '#/components/schemas/InitialAccessTokenState'
        revoked_at:
          type: string
          format: date-time
          nullable: true

    Webhook:
      type: object
      additionalProperties: false
      required: [id, url, description, events, is_enabled, disabled_reason, failing_since, previous_secret_until, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: Where deliveries go. https; its address is checked before every delivery.
        description:
          type: string
        events:
          $ref: '#/components/schemas/WebhookEvents'
        is_enabled:
          type: boolean
          description: Whether deliveries are made. A disabled endpoint keeps its settings.
        disabled_reason:
          type: string
          enum: [operator, failing]
          nullable: true
          description: |
            Why it is off: an `operator` switched it off, or it was `failing` every delivery for five
            days. Null while it is on.
        failing_since:
          type: string
          format: date-time
          nullable: true
          description: |
            When the deliveries that have all failed since began; null once one succeeds. Five days
            of it switch the endpoint off. Switching it on or off starts it over.
        previous_secret_until:
          type: string
          format: date-time
          nullable: true
          description: Until when the secret before the last rotation still signs beside the current one.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookDelivery:
      description: One audit event's delivery to one endpoint, through its attempts. Never a body.
      type: object
      additionalProperties: false
      required: [id, event_id, event_type, status, attempts, next_attempt_at, last_status_code,
        last_duration_ms, last_failure, created_at, ended_at]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
          description: The audit event sent, and the `webhook-id` header it was sent with.
        event_type:
          type: string
        status:
          type: string
          enum: [pending, succeeded, abandoned]
          description: |
            `pending` until a 2xx (`succeeded`), or until the retries run out or it can no longer be
            sent (`abandoned`).
        attempts:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: When it is tried next; null once it ended.
        last_status_code:
          type: integer
          nullable: true
          description: What the receiver answered last; null when it was not reached.
        last_duration_ms:
          type: integer
          nullable: true
        last_failure:
          type: string
          enum: [status, connection, refused_url, disabled, event_purged]
          nullable: true
          description: |
            Why the last attempt failed: a non-2xx `status`; no answer in time (`connection`); a
            URL that now resolves somewhere private (`refused_url`); or, ended without an attempt,
            an endpoint switched off (`disabled`) or an event purged (`event_purged`).
        created_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true

    WebhookDeliveryPage:
      type: object
      additionalProperties: false
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1

    WebhookPayload:
      description: |
        The body of every webhook delivery: an envelope in the Standard Webhooks form around the
        audit event, exactly as `GET /api/v1/audit-events` returns it. Not an operation of this
        API: what this server posts to an endpoint.

        The example was posted with `webhook-id: 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d`,
        `webhook-timestamp: 1772616600` and
        `webhook-signature: v1,68MpbkTCRDhYK+2J3FjqldjIIqgDCOUQWa5Nl1GaTAM=`, signed with the
        secret of the `WebhookWithSecret` example (not a real one), over the example encoded as
        compact JSON in the order shown.
      type: object
      additionalProperties: false
      required: [type, timestamp, data]
      properties:
        type:
          type: string
          description: The audit event's type, as in `data.type`.
        timestamp:
          type: string
          format: date-time
          description: When this attempt was made; `webhook-timestamp` says the same in Unix seconds.
        data:
          $ref: '#/components/schemas/AuditEvent'
      example:
        type: "webhook.tested"
        timestamp: "2026-03-04T09:30:00.000Z"
        data:
          id: "9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d"
          type: "webhook.tested"
          occurred_at: "2026-03-04T09:30:00Z"
          outcome: "success"
          actor:
            kind: "person"
            user_id: "3f8e2d1c-5b4a-4c9e-8d7f-6a5b4c3d2e1f"
            client_id: "Dsh8Kq2Wm5Np9Rt3Vx6Zb1Cf4Gj7Ln0Ps"
            provisioning_token_id: null
          target:
            type: "webhook"
            id: "6b0e5c9a-2f4d-4a1e-9b3c-7d8e9f0a1b2c"
          details: {}
          client_address: "203.0.113.42"
          user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/605.1.15"

    WebhookWithSecret:
      description: An endpoint, with the only copy of its new secret there will ever be.
      type: object
      additionalProperties: false
      required: [id, url, description, events, is_enabled, disabled_reason, failing_since, previous_secret_until, created_at, updated_at, secret]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: Where deliveries go. https; its address is checked before every delivery.
        description:
          type: string
        events:
          $ref: '#/components/schemas/WebhookEvents'
        is_enabled:
          type: boolean
          description: Whether deliveries are made. A disabled endpoint keeps its settings.
        disabled_reason:
          type: string
          enum: [operator, failing]
          nullable: true
          description: |
            Why it is off: an `operator` switched it off, or it was `failing` every delivery for five
            days. Null while it is on.
        failing_since:
          type: string
          format: date-time
          nullable: true
          description: |
            When the deliveries that have all failed since began; null once one succeeds. Five days
            of it switch the endpoint off. Switching it on or off starts it over.
        previous_secret_until:
          type: string
          format: date-time
          nullable: true
          description: Until when the secret before the last rotation still signs beside the current one.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        secret:
          type: string
          description: |
            `whsec_` and the base64 of 32 random bytes (Standard Webhooks). A receiver verifies each
            delivery's `webhook-signature` with the decoded bytes. Never shown again.

    WebhookEvents:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 64
      description: |
        The audit event types delivered (each one `GET /api/v1/audit-events` can report), or
        `["*"]` for all. An unknown type is refused, so a typo is never a silent "never".
        `webhook.tested` is not one to name: a test goes to the endpoint tested, and no other.

    WebhookCreate:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url:
          type: string
          minLength: 9
          maxLength: 2048
        description:
          type: string
          maxLength: 120
          default: ''
        events:
          $ref: '#/components/schemas/WebhookEvents'

    WebhookUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url:
          type: string
          minLength: 9
          maxLength: 2048
        description:
          type: string
          maxLength: 120
        events:
          $ref: '#/components/schemas/WebhookEvents'
        is_enabled:
          type: boolean

    IssuedInitialAccessToken:
      description: A token just issued, with its value, which is never shown again.
      type: object
      additionalProperties: false
      required: [id, description, created_at, expires_at, max_uses, uses, state, revoked_at, token]
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        max_uses:
          type: integer
          minimum: 1
        uses:
          type: integer
          minimum: 0
        state:
          $ref: '#/components/schemas/InitialAccessTokenState'
        revoked_at:
          type: string
          format: date-time
          nullable: true
        token:
          type: string
          description: |
            The value software sends as `Authorization: Bearer` to `/oauth2/register`. Only its
            digest is kept.

    ProvisioningTokenPage:
      description: One page of provisioning tokens, newest first.
      type: object
      additionalProperties: false
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProvisioningToken'
        total:
          $ref: '#/components/schemas/Total'
        page:
          $ref: '#/components/schemas/PageNumber'
        per_page:
          $ref: '#/components/schemas/PerPage'

    ProvisioningTokenCreate:
      type: object
      additionalProperties: false
      required: [connection, description]
      properties:
        connection:
          $ref: '#/components/schemas/ConnectionName'
        description:
          type: string
          minLength: 1
          maxLength: 120
          description: Which directory it is for. The token itself is never shown again, so this is how it is told apart.
        expires_in:
          type: integer
          minimum: 86400
          maximum: 63072000
          default: 31536000
          description: Seconds until it expires, from a day to two years. A year by default.
        subject_attribute:
          $ref: '#/components/schemas/ProvisioningSubjectAttribute'
        addresses_trusted:
          type: boolean
          default: false
          description: |
            Whether the addresses the directory sends are taken as verified. Off by default: only an
            operator's word makes a directory's address trusted, so a directory cannot verify an address
            it does not own and reach an existing account through it.
        delete_deactivates:
          type: boolean
          default: false
          description: |
            Whether a SCIM `DELETE` deactivates the account instead of deleting it, for operators who
            must keep accounts. Off by default, as RFC 7644 §3.6 says delete.

    ProvisioningToken:
      type: object
      additionalProperties: false
      required: [id, connection, description, created_at, expires_at, expiring_soon, state, revoked_at, subject_attribute, addresses_trusted, delete_deactivates]
      properties:
        id:
          type: string
          format: uuid
        connection:
          $ref: '#/components/schemas/ConnectionName'
        description:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        expiring_soon:
          type: boolean
          description: |
            Whether an active token expires within thirty days: issue the next one, and give it to the
            directory, before provisioning stops.
        state:
          $ref: '#/components/schemas/ProvisioningTokenState'
        revoked_at:
          type: string
          format: date-time
          nullable: true
        subject_attribute:
          $ref: '#/components/schemas/ProvisioningSubjectAttribute'
        addresses_trusted:
          type: boolean
        delete_deactivates:
          type: boolean

    IssuedProvisioningToken:
      description: A token just issued, with its value, which is never shown again, and where to send it.
      type: object
      additionalProperties: false
      required: [id, connection, description, created_at, expires_at, expiring_soon, state, revoked_at, subject_attribute, addresses_trusted, delete_deactivates, token, base_url]
      properties:
        id:
          type: string
          format: uuid
        connection:
          $ref: '#/components/schemas/ConnectionName'
        description:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        expiring_soon:
          type: boolean
          description: |
            Whether an active token expires within thirty days: issue the next one, and give it to the
            directory, before provisioning stops.
        state:
          $ref: '#/components/schemas/ProvisioningTokenState'
        revoked_at:
          type: string
          format: date-time
          nullable: true
        subject_attribute:
          $ref: '#/components/schemas/ProvisioningSubjectAttribute'
        addresses_trusted:
          type: boolean
        delete_deactivates:
          type: boolean
        token:
          type: string
          description: |
            The value the directory sends as `Authorization: Bearer` (Entra ID's "Secret Token", Okta's
            HTTP header). Only its digest is kept.
        base_url:
          type: string
          format: uri
          description: The SCIM base URL to give the directory (Entra ID's "Tenant URL", Okta's "SCIM connector base URL").

    ProvisioningTokenState:
      type: string
      enum: [active, expired, revoked]
      description: |
        `active` reaches `/scim/v2`; `revoked` was stopped by an operator, `expired` passed its date.

    ProvisioningSubjectAttribute:
      type: string
      enum: [externalId, userName]
      default: externalId
      description: |
        The SCIM attribute naming a person to an enterprise connection: their first SAML or OpenID
        Connect sign-in is found by it. Entra ID sends `externalId` (map it from the object id, which
        its SAML `objectidentifier` claim carries); Okta sends its login as `userName`. Unused for a pool.

    InitialAccessTokenState:
      type: string
      enum: [active, expired, used_up, revoked]
      description: |
        `active` registers clients; `revoked` was stopped by an operator, `expired` passed its
        date, `used_up` registered as many clients as it allows.

    UserJob:
      description: A bulk job on the users, and its report. Never its input.
      type: object
      additionalProperties: false
      required: [id, type, status, connection, created_at, started_at, finished_at, summary, errors, failure]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [users_import, users_export]
        status:
          type: string
          enum: [queued, running, completed, failed]
          description: |
            `queued` until `clavia jobs:run` takes it; `failed` when it stopped as a whole (its
            worker died), with `failure` saying why.
        connection:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        summary:
          type: object
          additionalProperties: false
          required: [total, created, failed]
          properties:
            total:
              type: integer
              minimum: 0
              description: An import's lines read so far, blank ones aside; an export's accounts written.
            created:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
        errors:
          type: array
          description: The refused lines, the first thousand.
          items:
            type: object
            additionalProperties: false
            required: [line, error, detail]
            properties:
              line:
                type: integer
                minimum: 1
              error:
                type: string
                enum: [invalid_connection, invalid_json, invalid_field, unsupported_hash, already_exists]
              detail:
                type: string
        failure:
          type: string
          nullable: true

    RolePage:
      description: One page of roles, newest first.
      type: object
      additionalProperties: false
      required: [items, total, page, per_page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        total:
          $ref: '#/components/schemas/Total'
        page:
          $ref: '#/components/schemas/PageNumber'
        per_page:
          $ref: '#/components/schemas/PerPage'

    Total:
      type: integer
      minimum: 0
      description: Matching items across every page.
    PageNumber:
      type: integer
      minimum: 1
    PerPage:
      type: integer
      minimum: 1
      maximum: 100

    ProfileName:
      type: string
      minLength: 1
      maxLength: 255

    User:
      type: object
      additionalProperties: false
      required: [id, connection, email, email_verified, is_active, has_password, mfa_enrolled, passkey_count,
        name, given_name, family_name, nickname, picture, locale, created_at, updated_at, app_metadata]
      properties:
        id:
          type: string
          format: uuid
          description: The OIDC `sub`. Stable and opaque.
        connection:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
          description: |
            The pool the account was created in, or the external connection that created it.
            Fixed for good. The same address may exist in two pools as two accounts.
        email:
          type: string
        email_verified:
          type: boolean
        is_active:
          type: boolean
        has_password:
          type: boolean
          description: Whether the account can be signed into with a password at all.
        mfa_enrolled:
          type: boolean
          description: |
            Whether signing in asks for a second factor: a confirmed TOTP authenticator, or a
            passkey. Set by the account holder at `/auth/mfa/enroll` or `/auth/passkeys`;
            cleared by them, by `DELETE /api/v1/users/{user_id}/mfa` for the authenticator, and
            by `DELETE /api/v1/users/{user_id}/passkeys/{passkey_id}` for each passkey.
        passkey_count:
          type: integer
          minimum: 0
          description: How many passkeys the account holds (`GET /api/v1/users/{user_id}/passkeys`).
        name:
          type: string
          nullable: true
        given_name:
          type: string
          nullable: true
        family_name:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        picture:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        app_metadata:
          $ref: '#/components/schemas/AppMetadata'

    AppMetadata:
      type: object
      additionalProperties: true
      description: |
        Facts operators keep about the account (a tenant, a plan, a department), which claim
        mappings can copy into tokens; `{}` when none. Written only through `PATCH
        /api/v1/users/{user_id}` with `update:users_app_metadata`, never by the person or a
        provider. At most 16 KiB encoded, five levels of objects and lists, and keys of 1 to 64
        letters, digits, `_` or `-` at every level. Its keys come back sorted.

    UserCreate:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        connection:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
          description: |
            The pool to create it in; the default pool, `password`, when omitted. An external
            connection's accounts are made by signing in through it (422).
        email:
          type: string
          minLength: 3
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: |
            At least 8 characters, at most 256 (1,024 bytes once encoded). With
            `CLAVIA_BREACHED_PASSWORD_CHECK` on, a password found in Have I Been Pwned's Pwned
            Passwords is refused (422). Omit it to create the account without one; it is then
            invited with `POST /users/{user_id}/password-reset`.
        email_verified:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        name:
          $ref: '#/components/schemas/ProfileName'
        given_name:
          $ref: '#/components/schemas/ProfileName'
        family_name:
          $ref: '#/components/schemas/ProfileName'
        nickname:
          $ref: '#/components/schemas/ProfileName'
        picture:
          type: string
          maxLength: 2048
          description: An absolute http(s) URL.
        locale:
          type: string
          maxLength: 35
          description: A BCP 47 language tag, such as `en-GB`.

    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: A new password, under the same rules as at creation.
        email_verified:
          type: boolean
        is_active:
          type: boolean
        name:
          type: string
          maxLength: 255
          nullable: true
        given_name:
          type: string
          maxLength: 255
          nullable: true
        family_name:
          type: string
          maxLength: 255
          nullable: true
        nickname:
          type: string
          maxLength: 255
          nullable: true
        picture:
          type: string
          maxLength: 2048
          nullable: true
        locale:
          type: string
          maxLength: 35
          nullable: true
        app_metadata:
          $ref: '#/components/schemas/AppMetadata'

    ClientType:
      type: string
      enum: [public, confidential]
    AuthMethod:
      type: string
      enum: [none, client_secret_basic, client_secret_post]
    GrantType:
      type: string
      enum: [authorization_code, client_credentials, refresh_token, 'urn:ietf:params:oauth:grant-type:device_code']
      description: |
        `refresh_token` goes with `authorization_code` or the device code grant (RFC 8628): a
        refresh token is issued with a person's tokens, and rotates on every use. The device
        code grant is for first-party applications only.
    ResponseType:
      type: string
      enum: [code]
    RedirectUri:
      type: string
      minLength: 1
      maxLength: 2048
      description: An absolute URI without a fragment, matched exactly.

    Client:
      type: object
      additionalProperties: false
      required: [client_id, name, client_type, token_endpoint_auth_method, redirect_uris, grant_types,
        response_types, post_logout_redirect_uris, is_first_party, connections, backchannel_logout_uri,
        backchannel_logout_session_required, require_pkce, mfa_policy, require_pushed_authorization_requests,
        dpop_bound_access_tokens, accent_color, logo_version, registration, created_at, claims]
      properties:
        client_id:
          type: string
        name:
          type: string
        client_type:
          $ref: '#/components/schemas/ClientType'
        token_endpoint_auth_method:
          $ref: '#/components/schemas/AuthMethod'
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            $ref: '#/components/schemas/GrantType'
        response_types:
          type: array
          items:
            $ref: '#/components/schemas/ResponseType'
        post_logout_redirect_uris:
          type: array
          items:
            type: string
        is_first_party:
          $ref: '#/components/schemas/IsFirstParty'
        connections:
          type: array
          description: |
            The connections its users may sign in through, by name. Always empty for a
            third-party application: it uses the domain connections.
          items:
            $ref: '#/components/schemas/ConnectionName'
        backchannel_logout_uri:
          type: string
          nullable: true
          description: |
            Where a logout token is posted when a session the client signed in through ends
            (OpenID Connect Back-Channel Logout 1.0). Null: the client is not told.
        backchannel_logout_session_required:
          type: boolean
          description: Whether the client needs the session named (`sid`). It always is.
        require_pkce:
          type: boolean
          description: |
            Whether every authorization request must carry PKCE. False only for a
            confidential client, whose OpenID Connect requests carrying a `nonce` may then
            omit it (OAuth 2.1 §7.5.1).
        mfa_policy:
          $ref: '#/components/schemas/MfaPolicy'
        require_pushed_authorization_requests:
          type: boolean
          description: |
            Whether its authorization requests must be pushed to `/oauth2/par` first and reach
            `/oauth2/authorize` by `request_uri` (RFC 9126 §6). A request sent any other way is
            refused with `invalid_request`.
        dpop_bound_access_tokens:
          type: boolean
          description: |
            Whether every token it is issued must be bound to a DPoP key (RFC 9449 §5.2): a token
            request without a `DPoP` proof is refused (`invalid_dpop_proof`). Off by default, when a
            proof is welcome but not required. Takes effect from its next token request: tokens
            already issued keep working as they were.
        accent_color:
          type: string
          nullable: true
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: The application's colour on its sign-in pages (see `AccentColor`); null for this server's.
        logo_version:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{16}$'
          description: |
            Its logo on the sign-in pages, named by a digest of the image (it changes with the image);
            `GET /api/v1/clients/{client_id}/logo` downloads it. Null when the pages show this server's.
        registration:
          type: object
          nullable: true
          additionalProperties: false
          required: [initial_access_token_id, registered_at]
          description: |
            For a client that registered itself at `/oauth2/register` (RFC 7591): which initial
            access token let it in, and when. Null for a client an operator made. Such a client is
            always third-party.
          properties:
            initial_access_token_id:
              type: string
              format: uuid
              nullable: true
              description: Null once that token no longer exists.
            registered_at:
              type: string
              format: date-time
        created_at:
          type: string
          format: date-time
        claims:
          $ref: '#/components/schemas/ApplicationClaims'

    AccentColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      description: |
        The application's colour on its sign-in pages (buttons, links, chosen options), `#` and six
        hexadecimal digits, kept in lower case. The text on it is worked out: white or dark ink, whichever
        contrasts more. Its pages are told it by a stylesheet of the sign-in origin, never inline.

    ApplicationClaims:
      type: array
      maxItems: 20
      items:
        $ref: '#/components/schemas/ApplicationClaimMapping'
      description: |
        Custom claims in this application's ID tokens and userinfo answers, beside the protocol's
        and what the scope releases (see `ClaimMapping`). A first-party application's only: a
        third-party application has none, and is refused any (422), since no consent screen names
        them. Dynamic registration never sets them.

    IsFirstParty:
      type: boolean
      description: |
        Who runs the application. First-party — the operator's own — skips the consent screen
        unless the API it asks for insists. Third-party — somebody else's, its id starting
        with `tpc_` — puts every scope to the person on the consent screen, and is never
        given a token for a system API, on anybody's behalf or as itself.

    ClientWithSecret:
      description: A client, with the only copy of its secret there will ever be.
      type: object
      additionalProperties: false
      required: [client_id, name, client_type, token_endpoint_auth_method, redirect_uris, grant_types,
        response_types, post_logout_redirect_uris, is_first_party, connections, backchannel_logout_uri,
        backchannel_logout_session_required, require_pkce, mfa_policy, require_pushed_authorization_requests,
        dpop_bound_access_tokens, accent_color, logo_version, registration, created_at, claims, client_secret]
      properties:
        client_id:
          type: string
        name:
          type: string
        client_type:
          $ref: '#/components/schemas/ClientType'
        token_endpoint_auth_method:
          $ref: '#/components/schemas/AuthMethod'
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            $ref: '#/components/schemas/GrantType'
        response_types:
          type: array
          items:
            $ref: '#/components/schemas/ResponseType'
        post_logout_redirect_uris:
          type: array
          items:
            type: string
        is_first_party:
          $ref: '#/components/schemas/IsFirstParty'
        connections:
          type: array
          description: |
            The connections its users may sign in through, by name. Always empty for a
            third-party application: it uses the domain connections.
          items:
            $ref: '#/components/schemas/ConnectionName'
        backchannel_logout_uri:
          type: string
          nullable: true
          description: |
            Where a logout token is posted when a session the client signed in through ends
            (OpenID Connect Back-Channel Logout 1.0). Null: the client is not told.
        backchannel_logout_session_required:
          type: boolean
          description: Whether the client needs the session named (`sid`). It always is.
        require_pkce:
          type: boolean
          description: |
            Whether every authorization request must carry PKCE. False only for a
            confidential client, whose OpenID Connect requests carrying a `nonce` may then
            omit it (OAuth 2.1 §7.5.1).
        mfa_policy:
          $ref: '#/components/schemas/MfaPolicy'
        require_pushed_authorization_requests:
          type: boolean
          description: |
            Whether its authorization requests must be pushed to `/oauth2/par` first and reach
            `/oauth2/authorize` by `request_uri` (RFC 9126 §6). A request sent any other way is
            refused with `invalid_request`.
        dpop_bound_access_tokens:
          type: boolean
          description: |
            Whether every token it is issued must be bound to a DPoP key (RFC 9449 §5.2): a token
            request without a `DPoP` proof is refused (`invalid_dpop_proof`). Off by default, when a
            proof is welcome but not required. Takes effect from its next token request: tokens
            already issued keep working as they were.
        accent_color:
          type: string
          nullable: true
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: The application's colour on its sign-in pages (see `AccentColor`); null for this server's.
        logo_version:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{16}$'
          description: |
            Its logo on the sign-in pages, named by a digest of the image (it changes with the image);
            `GET /api/v1/clients/{client_id}/logo` downloads it. Null when the pages show this server's.
        registration:
          type: object
          nullable: true
          additionalProperties: false
          required: [initial_access_token_id, registered_at]
          description: |
            For a client that registered itself at `/oauth2/register` (RFC 7591): which initial
            access token let it in, and when. Null for a client an operator made. Such a client is
            always third-party.
          properties:
            initial_access_token_id:
              type: string
              format: uuid
              nullable: true
              description: Null once that token no longer exists.
            registered_at:
              type: string
              format: date-time
        created_at:
          type: string
          format: date-time
        claims:
          $ref: '#/components/schemas/ApplicationClaims'
        client_secret:
          type: string
          nullable: true
          description: Null for a public client, which has none.

    ClientCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
          default: ''
        client_type:
          $ref: '#/components/schemas/ClientType'
        token_endpoint_auth_method:
          $ref: '#/components/schemas/AuthMethod'
        redirect_uris:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RedirectUri'
        grant_types:
          type: array
          items:
            $ref: '#/components/schemas/GrantType'
        response_types:
          type: array
          items:
            $ref: '#/components/schemas/ResponseType'
        post_logout_redirect_uris:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RedirectUri'
          description: |
            Where a sign-out the client starts at `/oidc/logout` may send the browser back
            (OpenID Connect RP-Initiated Logout 1.0 §3.1). Matched exactly.
        is_first_party:
          type: boolean
          default: true
          description: |
            `false` registers a third-party application: its id starts with `tpc_`. See
            `IsFirstParty`. Fixed for good: there is no such field on an update.
        connections:
          type: array
          maxItems: 64
          description: |
            The connections its users may sign in through. Every connection there is when
            omitted, for a first-party application; a third-party one cannot have a list (422).
            An unknown name is a 404. Changed afterwards with `PUT …/connections`.
          items:
            $ref: '#/components/schemas/ConnectionName'
        backchannel_logout_uri:
          type: string
          nullable: true
          maxLength: 2048
          description: |
            Where to post a logout token when a session the client signed in through ends
            (OpenID Connect Back-Channel Logout 1.0 §2.2): an absolute https URL without a
            fragment, and not at this server or its internal network (422). Null for none.
        backchannel_logout_session_required:
          type: boolean
        require_pkce:
          type: boolean
          description: |
            False relieves a confidential client of PKCE for OpenID Connect requests that
            carry a `nonce` (OAuth 2.1 §7.5.1); a public client is refused (422). Defaults
            to true.
        mfa_policy:
          $ref: '#/components/schemas/MfaPolicy'
        require_pushed_authorization_requests:
          type: boolean
          description: |
            Whether its authorization requests must be pushed to `/oauth2/par` first and reach
            `/oauth2/authorize` by `request_uri` (RFC 9126 §6). A request sent any other way is
            refused with `invalid_request`.
        dpop_bound_access_tokens:
          type: boolean
          description: |
            Whether every token it is issued must be bound to a DPoP key (RFC 9449 §5.2): a token
            request without a `DPoP` proof is refused (`invalid_dpop_proof`). Off by default, when a
            proof is welcome but not required. Takes effect from its next token request: tokens
            already issued keep working as they were.
        accent_color:
          $ref: '#/components/schemas/AccentColor'
      description: |
        `client_type` defaults to `public`; `token_endpoint_auth_method` to `none` for a
        public client and `client_secret_basic` for a confidential one.

    ClientUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        `client_type` and `is_first_party` are identity, not configuration: neither can change
        (422 if sent). Register another client instead.
      properties:
        name:
          type: string
          maxLength: 120
        token_endpoint_auth_method:
          $ref: '#/components/schemas/AuthMethod'
        redirect_uris:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RedirectUri'
        grant_types:
          type: array
          items:
            $ref: '#/components/schemas/GrantType'
        response_types:
          type: array
          items:
            $ref: '#/components/schemas/ResponseType'
        post_logout_redirect_uris:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RedirectUri'
        backchannel_logout_uri:
          type: string
          nullable: true
          maxLength: 2048
          description: |
            Where to post a logout token when a session the client signed in through ends
            (OpenID Connect Back-Channel Logout 1.0 §2.2): an absolute https URL without a
            fragment, and not at this server or its internal network (422). Null removes it.
        backchannel_logout_session_required:
          type: boolean
        require_pkce:
          type: boolean
          description: |
            False relieves a confidential client of PKCE for OpenID Connect requests that
            carry a `nonce` (OAuth 2.1 §7.5.1); a public client is refused (422).
        mfa_policy:
          $ref: '#/components/schemas/MfaPolicy'
        require_pushed_authorization_requests:
          type: boolean
          description: |
            Whether its authorization requests must be pushed to `/oauth2/par` first and reach
            `/oauth2/authorize` by `request_uri` (RFC 9126 §6). A request sent any other way is
            refused with `invalid_request`.
        dpop_bound_access_tokens:
          type: boolean
          description: |
            Whether every token it is issued must be bound to a DPoP key (RFC 9449 §5.2): a token
            request without a `DPoP` proof is refused (`invalid_dpop_proof`). Off by default, when a
            proof is welcome but not required. Takes effect from its next token request: tokens
            already issued keep working as they were.
        accent_color:
          type: string
          nullable: true
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: The application's colour on its sign-in pages (see `AccentColor`); null gives it this server's back.
        claims:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ApplicationClaimMapping'
          description: Replaces the application's custom claims; refused for a third-party application (422).

    Permission:
      type: object
      additionalProperties: false
      required: [value, description]
      properties:
        value:
          type: string
        description:
          type: string

    PermissionInput:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[!#-\[\]-~]+$'
          description: A scope token (RFC 6749 §3.3).
        description:
          type: string
          maxLength: 500
          default: ''

    ResourceServer:
      type: object
      additionalProperties: false
      required: [id, identifier, name, permissions, is_system, enforce_policies, allow_skipping_consent,
        access_token_format, mfa_policy, created_at, claims]
      properties:
        id:
          type: string
        identifier:
          type: string
          description: The `audience` a client names and the `aud` its token carries.
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        is_system:
          type: boolean
          description: An API the server itself depends on. Not deletable; its permissions are the server's own.
        enforce_policies:
          $ref: '#/components/schemas/EnforcePolicies'
        allow_skipping_consent:
          $ref: '#/components/schemas/AllowSkippingConsent'
        access_token_format:
          $ref: '#/components/schemas/AccessTokenFormat'
        mfa_policy:
          $ref: '#/components/schemas/MfaPolicy'
        created_at:
          type: string
          format: date-time
        claims:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ClaimMapping'

    ClaimMapping:
      type: object
      additionalProperties: false
      required: [name, source]
      description: |
        A custom claim of an API: added to its access tokens (the JWT form) and to what
        introspection reports about them, worked out from the account at each issuance (a
        refresh included) and, for introspection, when asked. So a JWT and its introspection can
        part ways after a change: the JWT keeps what was true when it was issued.

        Left out of a token when its source has no value (never `null`), of a machine token unless
        it is a constant, and of every token issued to a third-party application, which no
        consent screen told about it. Past 32 KiB of custom claims in one token, the token is
        refused (500) rather than cut down.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            An https URI (at most 255 characters), or 1 to 64 letters, digits, `.`, `_` or `-`.
            Never a registered JWT claim (the IANA registry), an OpenID Connect standard claim,
            an introspection member, or this server's own (`sub`, `aud`, `acr`, `email`,
            `scope`, `client_id`, `cnf`…); `roles` (RFC 9068 §2.2.3.1) is the one exception,
            from the `roles` source.
        source:
          type: string
          minLength: 1
          maxLength: 330
          description: |
            `email`, `email_verified`, `connection`, `profile.<field>` (`name`, `given_name`,
            `family_name`, `nickname`, `picture`, `locale`), `app_metadata.<path>` (at most five
            keys joined by `.`), `roles` (the names of the person's roles holding a permission on
            this API), or `constant`.
        value:
          description: For a `constant` only, and required there; any JSON value but `null`, at most 1 KiB.

    ApplicationClaimMapping:
      type: object
      additionalProperties: false
      required: [name, source, in]
      description: |
        A custom claim of an application, as `ClaimMapping` describes one, and where it goes: the
        ID tokens the application is issued, its userinfo answers, or both. Worked out from the
        account at each issuance (an ID token) or each request (userinfo). `roles` is not a name
        an application may use: RFC 9068 defines it for access tokens; the `roles` source gives
        all of the person's roles here.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        source:
          type: string
          minLength: 1
          maxLength: 330
        value:
          description: For a `constant` only, and required there.
        in:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
            enum: [id_token, userinfo]

    EnforcePolicies:
      type: boolean
      description: |
        Whether a token issued on a person's behalf carries only the permissions their roles
        grant on this API, and is refused to somebody holding none. Machine clients are
        governed by their client grants either way. Always on for a system API.

    AllowSkippingConsent:
      type: boolean
      description: |
        Whether a first-party application asking for this API's permissions on a person's
        behalf may do without the consent screen: the operator runs both, so signing in is
        the consent. A third-party application asks whatever this says. Always on for a
        system API, which no third-party application reaches.

    MfaPolicy:
      type: string
      enum: [optional, required]
      default: optional
      description: |
        Whether people must sign in with more than one factor to be let in: through this
        application, or to be issued a token for this API. Required on either one is required.

        - `optional`: what the authorization request asks with `acr_values`, and nothing more.
          A person who enrolled a second factor is asked for it anyway.
        - `required`: more than one factor (the `acr`
          `http://schemas.openid.net/pape/policies/2007/06/multi-factor`). A signed-in person
          who used one gives another without signing in again; someone with no second factor
          sets one up on the way, if their address is verified.

        It applies from the next authorization on: tokens already issued keep working.

    AccessTokenFormat:
      type: string
      enum: [opaque, jwt]
      description: |
        The form of the access tokens issued for this API, from the next token on.

        - `opaque`: a random string the API resolves at the introspection endpoint
          (RFC 7662), which reports a revocation the moment it happens.
        - `jwt`: a JWT access token (RFC 9068, `typ: at+jwt`) signed with the keys published
          at the JWKS, which the API validates on its own. Revocation cannot reach it: a
          revoked JWT is accepted by an API that validates it locally until it expires, so the
          access token lifetime bounds how long that lasts. This server still refuses it
          wherever it is presented here (introspection, userinfo, this API).

        A token naming no API is always opaque.

    ResourceServerCreate:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 255
          description: An absolute URI without a fragment, on a domain you own. Never dereferenced.
        name:
          type: string
          maxLength: 120
          default: ''
        permissions:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PermissionInput'
        enforce_policies:
          type: boolean
          default: false
          description: See `ResourceServer.enforce_policies`.
        allow_skipping_consent:
          type: boolean
          default: true
          description: See `ResourceServer.allow_skipping_consent`.
        access_token_format:
          type: string
          enum: [opaque, jwt]
          default: opaque
          description: See `ResourceServer.access_token_format`.
        mfa_policy:
          $ref: '#/components/schemas/MfaPolicy'

    ResourceServerUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        A system API may be renamed and nothing else: its permissions are the server's own,
        turning its roles off would hand them to anybody who can sign in, and no
        third-party application reaches it to be asked about (409).
      properties:
        name:
          type: string
          maxLength: 120
        permissions:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PermissionInput'
        enforce_policies:
          type: boolean
        allow_skipping_consent:
          type: boolean
        access_token_format:
          $ref: '#/components/schemas/AccessTokenFormat'
        mfa_policy:
          $ref: '#/components/schemas/MfaPolicy'
        claims:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ClaimMapping'

    ConnectionName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,31}$'
      description: Lower-case letters, digits and dashes, starting with a letter; at most 32.

    ConnectionNames:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ConnectionName'

    ConnectionStrategy:
      type: string
      enum: [database, social, oidc, passwordless, saml]
      description: |
        `database`: a pool of accounts with passwords, held here. `social`: a provider the
        code implements (Google, GitHub), credentials from the deployment's settings.
        `oidc`: any OpenID Connect provider, registered from its issuer. `saml`: a SAML 2.0
        identity provider, registered from its metadata. `passwordless`:
        the built-in `email` connection — a code or a link sent by email; never created.

    Connection:
      type: object
      additionalProperties: false
      required: [name, display_name, strategy, is_enabled, is_domain_connection, allow_sign_up,
        require_verified_email, require_provisioning, configured, usable, oidc_issuer, oidc_client_id, oidc_scope,
        saml, created_at]
      properties:
        name:
          $ref: '#/components/schemas/ConnectionName'
        display_name:
          type: string
        strategy:
          $ref: '#/components/schemas/ConnectionStrategy'
        is_enabled:
          type: boolean
          description: The global switch. Off means off for every application.
        is_domain_connection:
          type: boolean
          description: |
            A domain connection: open to every third-party application, which gets no other
            kind. A first-party application goes by its own list.
        allow_sign_up:
          type: boolean
          description: |
            A pool only: people may create their own account in it, from the sign-up page of an
            application that enables it.
        require_verified_email:
          type: boolean
          description: |
            A pool only: an account in it signs in with its password only once it has followed the
            verification link it is sent. With sign-up open, this stops anyone registering a
            stranger's address.
        require_provisioning:
          type: boolean
          description: |
            An OpenID Connect or SAML connection only: only the people a directory provisioned through
            SCIM sign in through it, and nobody else's account is created on the way. The directory then
            decides who gets in, and somebody it removed cannot come back by signing in again.
        configured:
          type: boolean
          description: |
            Whether it could work if switched on: always for a pool; for the passwordless one,
            when the deployment sends mail; for a social connection, when the deployment set its
            credentials; for an OIDC one, when its secret decrypts.
        usable:
          type: boolean
          description: Switched on and configured — what the login page actually offers.
        oidc_issuer:
          type: string
          nullable: true
        oidc_client_id:
          type: string
          nullable: true
        oidc_scope:
          type: string
          nullable: true
          description: What is asked of the provider. The client secret is never returned.
        saml:
          $ref: '#/components/schemas/SamlConnection'
        created_at:
          type: string
          format: date-time

    SamlConnection:
      description: A `saml` connection's identity provider and options; null for any other kind.
      type: object
      nullable: true
      additionalProperties: false
      required: [entity_id, sso_url, metadata_url, certificates, subject_attribute, name_id_format,
        email_attribute, email_trusted, name_attribute, given_name_attribute, family_name_attribute,
        sign_requests, require_encryption, require_gcm, service_provider]
      properties:
        entity_id:
          type: string
          description: The identity provider's entity ID, from its metadata; the `Issuer` it must name.
        sso_url:
          type: string
          description: Its HTTP-Redirect single sign-on service, https.
        metadata_url:
          type: string
          nullable: true
          description: Where its metadata is read again (`refresh-metadata`); null when it was given as a document.
        certificates:
          type: array
          minItems: 1
          maxItems: 3
          description: |
            The certificates its assertions must be signed with, read-only: pinned by key, so the dates
            they state are shown, never enforced.
          items:
            type: object
            additionalProperties: false
            required: [sha256, not_after]
            properties:
              sha256:
                type: string
                description: SHA-256 of the certificate's DER, lower-case hex.
              not_after:
                type: string
                format: date-time
                nullable: true
        subject_attribute:
          type: string
          nullable: true
          description: |
            The attribute that names the person (Entra's `objectidentifier`, ADFS's `objectGUID`);
            null for the persistent `NameID`. Never the address, which can change hands.
        name_id_format:
          type: string
          description: The `NameIDPolicy` asked for; persistent by default.
        email_attribute:
          type: string
          nullable: true
          description: Where the address is read; null for the `NameID` when it is an address.
        email_trusted:
          type: boolean
          description: |
            Whether the identity provider verifies the addresses it sends. Only a trusted address can
            link to an account that already exists.
        name_attribute:
          type: string
          nullable: true
        given_name_attribute:
          type: string
          nullable: true
        family_name_attribute:
          type: string
          nullable: true
        sign_requests:
          type: boolean
          description: Whether `AuthnRequest`s are signed, when this server has a signing key.
        require_encryption:
          type: boolean
          description: Whether a plain assertion is refused.
        require_gcm:
          type: boolean
          description: |
            Whether an assertion encrypted with AES-CBC is refused: on unless turned off. CBC is
            unauthenticated, and accepting it weakens GCM too (the algorithm an assertion names is not
            authenticated), so turn it off only for an identity provider that encrypts with CBC, as
            ADFS does by default.
        service_provider:
          type: object
          additionalProperties: false
          required: [entity_id, acs_url, metadata_url, warning]
          description: What to give the identity provider's administrator.
          properties:
            entity_id:
              type: string
            acs_url:
              type: string
              description: The assertion consumer service, HTTP-POST.
            metadata_url:
              type: string
              description: This server's metadata for the connection, with its certificates.
            warning:
              type: string
              nullable: true
              description: Why requests are unsigned and assertions cannot be encrypted, if they are not.

    SamlConnectionCreate:
      type: object
      additionalProperties: false
      description: |
        The identity provider's metadata, `metadata` (the document) or `metadata_url` (fetched now,
        https, never a private address), one of them; then the options, each with its default.
      properties:
        metadata:
          type: string
          minLength: 1
          maxLength: 1048576
          description: |
            The metadata document: one `EntityDescriptor` (or an aggregate holding exactly one) with
            one SAML 2.0 `IDPSSODescriptor`, an HTTP-Redirect single sign-on service on https and one
            to three RSA signing certificates of 2048 bits or more. No `DOCTYPE`.
        metadata_url:
          type: string
          minLength: 9
          maxLength: 2048
        subject_attribute:
          type: string
          minLength: 1
          maxLength: 255
        name_id_format:
          type: string
          maxLength: 255
          default: urn:oasis:names:tc:SAML:2.0:nameid-format:persistent
        email_attribute:
          type: string
          minLength: 1
          maxLength: 255
        email_trusted:
          type: boolean
          default: false
        name_attribute:
          type: string
          minLength: 1
          maxLength: 255
        given_name_attribute:
          type: string
          minLength: 1
          maxLength: 255
        family_name_attribute:
          type: string
          minLength: 1
          maxLength: 255
        sign_requests:
          type: boolean
          default: true
        require_encryption:
          type: boolean
          default: false
        require_gcm:
          type: boolean
          default: true
          description: |
            On by default: AES-CBC refused. Turn it off only for an identity provider that encrypts
            with CBC (ADFS's default).

    ConnectionDisplayName:
      type: string
      minLength: 1
      maxLength: 120

    ConnectionCreate:
      type: object
      additionalProperties: false
      required: [name, display_name, strategy]
      properties:
        name:
          $ref: '#/components/schemas/ConnectionName'
        display_name:
          $ref: '#/components/schemas/ConnectionDisplayName'
        strategy:
          $ref: '#/components/schemas/ConnectionStrategy'
        is_enabled:
          type: boolean
          default: true
        is_domain_connection:
          type: boolean
          default: false
        allow_sign_up:
          type: boolean
          default: false
          description: A pool only. Refused for any other kind.
        require_verified_email:
          type: boolean
          default: false
          description: A pool only. Refused for any other kind.
        require_provisioning:
          type: boolean
          default: false
          description: |
            An `oidc` or `saml` connection only, refused for any other kind: only the people a directory
            provisioned through SCIM sign in through it.
        oidc_issuer:
          type: string
          maxLength: 2048
          description: An `oidc` connection's issuer, https. Required for one, refused for any other.
        oidc_client_id:
          type: string
          minLength: 1
          maxLength: 255
        oidc_client_secret:
          type: string
          minLength: 1
          maxLength: 1024
        oidc_scope:
          type: string
          maxLength: 512
          description: Must include `openid`; `openid profile email` when omitted.
        saml:
          $ref: '#/components/schemas/SamlConnectionCreate'

    ConnectionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          $ref: '#/components/schemas/ConnectionDisplayName'
        is_enabled:
          type: boolean
        is_domain_connection:
          type: boolean
        allow_sign_up:
          type: boolean
          description: A pool only. Refused for any other kind.
        require_verified_email:
          type: boolean
          description: A pool only. Refused for any other kind.
        require_provisioning:
          type: boolean
          description: |
            An OpenID Connect or SAML connection only, refused for any other kind. Taking effect at the
            next sign-in: sessions already established stand.
        oidc_issuer:
          type: string
          maxLength: 2048
        oidc_client_id:
          type: string
          minLength: 1
          maxLength: 255
        oidc_client_secret:
          type: string
          minLength: 1
          maxLength: 1024
        oidc_scope:
          type: string
          maxLength: 512

    Identity:
      type: object
      additionalProperties: false
      required: [connection, subject, email, linked_at]
      properties:
        connection:
          $ref: '#/components/schemas/ConnectionName'
        subject:
          type: string
          description: The provider's identifier for the person — what the link is keyed on.
        email:
          type: string
          nullable: true
          description: What the provider reported when the link was made. Informational.
        linked_at:
          type: string
          format: date-time

    UserPasskey:
      type: object
      additionalProperties: false
      required: [id, name, synced, backed_up, aaguid, created_at, last_used_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: What the account holder calls it.
        synced:
          type: boolean
          description: Whether a credential manager backs it up across devices; false for one bound to a device.
        backed_up:
          type: boolean
          description: Whether it was backed up when last used.
        aaguid:
          type: string
          format: uuid
          nullable: true
          description: The make of the authenticator, when it says. A label, never a reason to refuse.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    UserSession:
      type: object
      additionalProperties: false
      required: [sid, created_at, expires_at, amr, connection, clients]
      description: |
        One browser session at `auth.*`. The cookie is never shown: nothing outside the
        browser holds it.
      properties:
        sid:
          type: string
          description: |
            The session's identifier for relying parties — the `sid` of the ID tokens issued
            through it — and the handle for ending it.
        created_at:
          type: string
          format: date-time
          description: When the person signed in.
        expires_at:
          type: string
          format: date-time
          description: The absolute ceiling; being idle may end it sooner.
        amr:
          type: array
          items:
            type: string
        connection:
          $ref: '#/components/schemas/ConnectionName'
        clients:
          type: array
          description: The applications that signed in through it — the ones ending it tells.
          items:
            type: object
            additionalProperties: false
            required: [client_id, name]
            properties:
              client_id:
                type: string
              name:
                type: string

    PasswordLinkSent:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [invitation, reset]
          description: |
            Which email went out: `invitation` for an account with no password yet, `reset`
            for one that has a password.

    UserConsent:
      type: object
      additionalProperties: false
      required: [client_id, client_name, is_first_party, audience, scopes, granted_at, updated_at]
      properties:
        client_id:
          type: string
        client_name:
          type: string
        is_first_party:
          $ref: '#/components/schemas/IsFirstParty'
        audience:
          type: string
          nullable: true
          description: The identifier of the API it is for; null for a request that named none.
        scopes:
          type: array
          description: Everything agreed to, OpenID Connect scopes included, sorted.
          items:
            type: string
        granted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: When the scopes last widened.

    RoleName:
      type: string
      minLength: 1
      maxLength: 64
      description: One line; unique across roles, matched exactly.

    RoleDescription:
      type: string
      maxLength: 500
      description: One line.

    Role:
      type: object
      additionalProperties: false
      required: [id, name, description, provisionable, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        provisionable:
          type: boolean
          description: |
            Whether a directory may grant it through SCIM: a group whose `displayName` is the role's
            name gives it to its members. A provisionable role never holds a permission on a system API
            (the Management API), whichever is asked first: `422`.
        created_at:
          type: string
          format: date-time

    RoleWithPermissions:
      description: A role, with what it grants.
      type: object
      additionalProperties: false
      required: [id, name, description, provisionable, created_at, permissions]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        provisionable:
          type: boolean
          description: |
            Whether a directory may grant it through SCIM: a group whose `displayName` is the role's
            name gives it to its members. A provisionable role never holds a permission on a system API
            (the Management API), whichever is asked first: `422`.
        created_at:
          type: string
          format: date-time
        permissions:
          type: array
          description: By API identifier, then value.
          items:
            $ref: '#/components/schemas/RolePermission'

    RolePermission:
      description: |
        A permission and the API that defines it — a role spans APIs, so a bare value would
        be ambiguous.
      type: object
      additionalProperties: false
      required: [resource_server_id, resource_server_identifier, value, description]
      properties:
        resource_server_id:
          type: string
        resource_server_identifier:
          type: string
        value:
          type: string
        description:
          type: string

    EffectivePermission:
      description: A permission a user holds, and every one of their roles that grants it.
      type: object
      additionalProperties: false
      required: [resource_server_id, resource_server_identifier, value, description, roles]
      properties:
        resource_server_id:
          type: string
        resource_server_identifier:
          type: string
        value:
          type: string
        description:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string

    PermissionReference:
      description: A permission, named by the API that defines it and its value.
      type: object
      additionalProperties: false
      required: [resource_server_id, value]
      properties:
        resource_server_id:
          type: string
          pattern: '^rs_[A-Za-z0-9]{16}$'
        value:
          type: string
          minLength: 1
          maxLength: 128

    RoleCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/RoleName'
        description:
          $ref: '#/components/schemas/RoleDescription'
        provisionable:
          type: boolean
          default: false
          description: Whether a directory's group may grant it; refused for a role holding a system API's permission.
        permissions:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/PermissionReference'

    RoleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/RoleName'
        description:
          $ref: '#/components/schemas/RoleDescription'
        provisionable:
          type: boolean
          description: Whether a directory's group may grant it; refused for a role holding a system API's permission.
        permissions:
          type: array
          maxItems: 500
          description: The whole new set.
          items:
            $ref: '#/components/schemas/PermissionReference'

    UserIds:
      type: object
      additionalProperties: false
      required: [user_ids]
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid

    RoleIds:
      type: object
      additionalProperties: false
      required: [role_ids]
      properties:
        role_ids:
          type: array
          maxItems: 100
          description: Every role the user is to hold; empty takes them all away.
          items:
            type: string
            pattern: '^rol_[A-Za-z0-9]{16}$'
