  /api/v1/signing-keys/rotate:
    post:
      tags: [signing-keys]
      operationId: rotateSigningKey
      summary: Rotate the signing key
      description: |
        A new key signs from now on. The one it replaces stops signing at once and stays in the
        JWKS for the grace period — twice the longest token lifetime, plus a day — so every
        token it signed keeps verifying until it expires. Relying parties that refetch the JWKS
        on an unknown `kid` find the new key straight away. Recorded as `signing_key.rotated`.
      security:
        - managementToken: [create:signing_keys]
      responses:
        '200':
          description: The key that signs now, and the one it replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyRotation'
              examples:
                SigningKeyRotation:
                  $ref: '#/components/examples/SigningKeyRotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/saml-keys:
    get:
      tags: [saml-keys]
      operationId: listSamlKeys
      summary: List SAML keys
      description: |
        Every service provider key: the current pair, the next one if a rotation is under way, and
        the retired ones still kept.
      security:
        - managementToken: [read:signing_keys]
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SamlKey'
              examples:
                SamlKeys:
                  $ref: '#/components/examples/SamlKeys'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/saml-keys/rotate:
    post:
      tags: [saml-keys]
      operationId: rotateSamlKeys
      summary: Rotate the SAML keys
      description: |
        One step of the rollover. With no keys, the first pair, current at once (`generated`). With
        no next pair, one is published beside the current one (`introduced`), and `promotes_at` says
        when it can be promoted. Before then nothing changes (`waiting`). After, the next pair becomes
        current and the one it replaces is retired (`promoted`). Retired keys past their overlap are
        deleted at every step. Recorded as `saml_key.generated` or `saml_key.rotated`.

        With the keys in a KMS (`CLAVIA_SAML_KEY_BACKEND` other than `postgres`) the rotation is the
        operator's: a new key version made there and named as the next pair, then as the current
        one, the old encryption key listed as retired. This answers 409.
      security:
        - managementToken: [create:signing_keys]
      responses:
        '200':
          description: The step taken, and every key after it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamlKeyRotation'
              examples:
                SamlKeyRotation:
                  $ref: '#/components/examples/SamlKeyRotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

