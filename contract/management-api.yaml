  /api/v1/resource-servers/{resource_server_id}:
    parameters:
      - $ref: '#/components/parameters/ResourceServerId'
    get:
      tags: [resource-servers]
      operationId: getResourceServer
      summary: Get an API
      security:
        - managementToken: [read:resource_servers]
      responses:
        '200':
          description: The API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceServer'
              examples:
