name: Release

# Pushing a tag `vX.Y.Z` publishes that version: the container image on ghcr.io and the GitHub
# release, whose notes are the changelog section. The steps around it, and what to check first,
# are in docs/RELEASING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# The third-party actions of the image job, which holds `packages: write`, are pinned to a commit
# (the version is in the comment); Dependabot's weekly `github-actions` update moves them.
jobs:
  # Nothing is published unless the tag, the code and the changelog agree.
  verify:
    name: Tag, package.json and changelog agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "${version}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: The tag is on main
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} is not on main: tag a commit that has been merged."; exit 1; }

      - name: The checks passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name | startswith("Format, lint"))][0].conclusion')
          [ "${conclusion}" = "success" ] \
            || { echo "::error::The CI checks did not succeed on ${GITHUB_SHA} (${conclusion:-none})."; exit 1; }

      - name: package.json carries the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          declared=$(jq -r '.version // empty' package.json)
          [ "${declared}" = "${VERSION}" ] \
            || { echo "::error::package.json says '${declared}', the tag says '${VERSION}'."; exit 1; }

      - name: CHANGELOG.md has a section for it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          grep -qE "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## [${VERSION}] - <date>' section."; exit 1; }

  # The production target of the Dockerfile: the standalone server and its static files.
  image:
    name: Container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # 0.1.0 also moves 0.1; `latest` follows the newest stable tag only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Last, so a release never exists without its image.
  release:
    name: GitHub release
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: The changelog section is the release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v header="## [${VERSION}] " '
            index($0, header) == 1 { printing = 1; next }
            printing && /^## \[/ { exit }
            printing && /^\[[^]]+\]: / { exit }
            printing { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          [ -s notes.md ] || { echo "::error::The changelog section for ${VERSION} is empty."; exit 1; }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          flags=()
          [ "${PRERELEASE}" = "true" ] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" --title "${VERSION}" --notes-file notes.md --verify-tag "${flags[@]}"
