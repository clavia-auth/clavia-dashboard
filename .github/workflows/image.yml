name: Image

# The container image a release publishes is built here too, without pushing it, whenever something
# that goes into it changes: a release then never meets a Dockerfile that was not built before.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/image.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/image.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build:
    name: Production image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          push: false
          tags: clavia-dashboard:ci

      # The server starts without configuration and answers: a request with no session is sent
      # to sign in, which is the dashboard doing its job (the settings are read on first use).
      - name: The server starts and runs as an unprivileged user
        run: |
          docker run --rm clavia-dashboard:ci id -u | grep -vx 0
          docker run -d --name dashboard -p 3000:3000 clavia-dashboard:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/dashboard/signed-out || true)
            [ "${code}" != "000" ] && break
            sleep 1
          done
          docker logs dashboard
          [ "${code}" != "000" ] || { echo "::error::The server did not answer."; exit 1; }
