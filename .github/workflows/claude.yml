# Claude, from inside GitHub: mention @claude in an issue, a pull request, a review or a
# comment, and Claude answers there, or implements the request and opens a pull request.
# Only people with write access to the repository can start it.
#
# Needs the Claude GitHub App on the repository, and a CLAUDE_CODE_OAUTH_TOKEN secret: the
# token `claude setup-token` prints for a Pro or Max subscription (an organization secret
# serves every repository).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The commands the ticket-* skills run (.claude/skills/).
          claude_args: >-
            --allowedTools "Bash(gh api *),Bash(gh pr *),Bash(gh issue *),Bash(git *),Bash(jq *),Bash(.claude/scripts/board.sh *),Bash(npm ci),Bash(npm run *)"
